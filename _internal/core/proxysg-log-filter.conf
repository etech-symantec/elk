
# ProxySG MAIN/SSL parser.
# The csv "columns" lists are generated on installation from PROXYSG_MAIN_LOG_FORMAT / PROXYSG_SSL_LOG_FORMAT
# (the ELFF "#Fields:" order of each log: MAIN, SSL and, if enabled, Cloud). Change the formats in the Config Wizard (step 7) instead of this file.
# A line that is exactly @@PROXYSG_MAIN_COLUMNS@@, @@PROXYSG_SSL_COLUMNS@@ or @@PROXYSG_CLOUD_COLUMNS@@ is replaced by that list;
# if you remove those lines and write the columns by hand, this text is used as it is.
# The lines between "# @@PROXYSG_CLOUD_BEGIN@@" and "# @@PROXYSG_CLOUD_END@@" (the Cloud branch) are kept only
# when PROXYSG_CLOUD_ENABLED is true; the two marker lines themselves are always removed.
filter {
  if [type] == "edge-http" or [type] == "edge-https" or [type] == "cloud" {
    if ![message] or [message] =~ /^\s*#/ or [message] =~ /^\s*$/ {
      drop { }
    }

    mutate {
      gsub => [
        "message", "\\\"", "",
        "message", "\\t", " "
      ]
    }

    if [type] == "edge-http" {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@PROXYSG_MAIN_COLUMNS@@
        ]
      }
    } else if [type] == "edge-https" {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@PROXYSG_SSL_COLUMNS@@
        ]
      }
# @@PROXYSG_CLOUD_BEGIN@@
    } else if [type] == "cloud" {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@PROXYSG_CLOUD_COLUMNS@@
        ]
      }
# @@PROXYSG_CLOUD_END@@
    }

    mutate {
      add_field => { "[@metadata][logtime]" => "%{log_date} %{log_time}" }
    }
    date {
      match => [ "[@metadata][logtime]", "YYYY-MM-dd HH:mm:ss", "YYYY-MM-dd HH:mm:ss.SSS" ]
      timezone => "UTC"
      target => "@timestamp"
    }
    mutate {
      convert => {
        "time_taken" => "integer"
        "sc_bytes" => "integer"
        "cs_bytes" => "integer"
      }
      remove_field => [ "message", "log_date", "log_time", "[@metadata][logtime]", "@version" ]
    }
  }
}
