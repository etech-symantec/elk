# ProxySG MAIN/SSL/Cloud ELFF parser.
# The column lists are generated on installation from PROXYSG_MAIN_LOG_FORMAT /
# PROXYSG_SSL_LOG_FORMAT / PROXYSG_CLOUD_LOG_FORMAT (the ELFF "#Fields:" order).
# This parser intentionally does NOT use csv { separator => " " } because ProxySG
# may emit multiple spaces between fields. It tokenizes whitespace only outside
# double quotes, so quoted values containing spaces remain a single field.
#
# A line that is exactly @@PROXYSG_MAIN_COLUMNS@@, @@PROXYSG_SSL_COLUMNS@@ or
# @@PROXYSG_CLOUD_COLUMNS@@ is replaced by the generated Logstash field list.
# The lines between the CLOUD markers are kept only when PROXYSG_CLOUD_ENABLED=true.
filter {
  if [type] == "edge-http" or [type] == "edge-https" or [type] == "cloud" {
    if ![message] or [message] =~ /^\s*#/ or [message] =~ /^\s*$/ {
      drop { }
    }

    ruby {
      init => '
        @proxysg_main_columns = [
@@PROXYSG_MAIN_COLUMNS@@
        ]
        @proxysg_ssl_columns = [
@@PROXYSG_SSL_COLUMNS@@
        ]
# @@PROXYSG_CLOUD_BEGIN@@
        @proxysg_cloud_columns = [
@@PROXYSG_CLOUD_COLUMNS@@
        ]
# @@PROXYSG_CLOUD_END@@
      '
      code => '
        line = event.get("message").to_s
        type = event.get("type").to_s
        columns = case type
                  when "edge-http" then @proxysg_main_columns
                  when "edge-https" then @proxysg_ssl_columns
# @@PROXYSG_CLOUD_BEGIN@@
                  when "cloud" then @proxysg_cloud_columns
# @@PROXYSG_CLOUD_END@@
                  else nil
                  end

        values = []
        buf = +""
        in_quotes = false
        escaped = false
        started = false

        line.each_char do |ch|
          if in_quotes
            if escaped
              if ch == "\\" || ch == "\""
                buf << ch
              else
                buf << "\\" << ch
              end
              escaped = false
            elsif ch == "\\"
              escaped = true
            elsif ch == "\""
              in_quotes = false
            else
              buf << ch
            end
            started = true
          else
            if ch == "\""
              in_quotes = true
              started = true
            elsif ch =~ /\s/
              if started
                values << buf
                buf = +""
                started = false
              end
            else
              buf << ch
              started = true
            end
          end
        end

        buf << "\\" if escaped
        values << buf if started

        reason = nil
        if in_quotes
          reason = "unclosed_quote"
        elsif columns.nil?
          reason = "unknown_type"
        elsif values.length != columns.length
          reason = "field_count_mismatch"
        else
          numeric_names = ["time_taken", "sc_bytes", "cs_bytes", "sc_status"]
          numeric_names.each do |name|
            idx = columns.index(name)
            next if idx.nil?
            value = values[idx].to_s
            next if value == "-" || value =~ /^\d+$/
            reason = "invalid_numeric_#{name}"
            break
          end
        end

        if reason
          tags = event.get("tags")
          tags = [] unless tags.is_a?(Array)
          tags << "_proxysg_parse_error" unless tags.include?("_proxysg_parse_error")
          event.set("tags", tags)
          event.set("proxysg_parse_error_reason", reason)
          event.set("proxysg_expected_fields", columns ? columns.length : 0)
          event.set("proxysg_actual_fields", values.length)
        else
          columns.each_with_index { |name, idx| event.set(name, values[idx]) }
          event.set("[@metadata][proxysg_parse_ok]", true)
        end
      '
    }

    if [@metadata][proxysg_parse_ok] {
      mutate {
        add_field => { "[@metadata][logtime]" => "%{log_date} %{log_time}" }
      }
      date {
        match => [ "[@metadata][logtime]", "YYYY-MM-dd HH:mm:ss", "YYYY-MM-dd HH:mm:ss.SSS" ]
        timezone => "UTC"
        target => "@timestamp"
      }

      if [time_taken] == "-" {
        mutate { remove_field => [ "time_taken" ] }
      } else {
        mutate { convert => { "time_taken" => "integer" } }
      }
      if [sc_bytes] == "-" {
        mutate { remove_field => [ "sc_bytes" ] }
      } else {
        mutate { convert => { "sc_bytes" => "integer" } }
      }
      if [cs_bytes] == "-" {
        mutate { remove_field => [ "cs_bytes" ] }
      } else {
        mutate { convert => { "cs_bytes" => "integer" } }
      }
      mutate {
        remove_field => [ "message", "log_date", "log_time", "[@metadata][logtime]", "[@metadata][proxysg_parse_ok]", "@version" ]
      }
    } else {
      # Keep the original message on parse failure so the malformed row can be diagnosed.
      mutate { remove_field => [ "@version" ] }
    }
  }
}
