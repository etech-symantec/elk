
# ProxySG MAIN/SSL/Cloud parser with ELFF field-aware timezone handling.
# The csv "columns" lists are generated on installation from PROXYSG_MAIN_LOG_FORMAT / PROXYSG_SSL_LOG_FORMAT
# (the ELFF "#Fields:" order of each log: MAIN, SSL and, if enabled, Cloud). Change the formats in the Config Wizard (step 7) instead of this file.
# A line that is exactly @@PROXYSG_MAIN_COLUMNS@@, @@PROXYSG_SSL_COLUMNS@@ or @@PROXYSG_CLOUD_COLUMNS@@ is replaced by that list;
# if you remove those lines and write the columns by hand, this text is used as it is.
# The lines between "# @@PROXYSG_CLOUD_BEGIN@@" and "# @@PROXYSG_CLOUD_END@@" (the Cloud branch) are kept only
# when PROXYSG_CLOUD_ENABLED is true; the two marker lines themselves are always removed.
filter {
  if [type] == "edge-http" or [type] == "edge-https" or [type] == "cloud" {
    if ![message] or [message] =~ /^\s*#/ or [message] =~ /^\s*$/ {
      drop { }
    }

    mutate {
      gsub => [
        "message", "\s+$", "",
        "message", "\s+", " "
      ]
    }

    if [type] == "edge-http" {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@PROXYSG_MAIN_COLUMNS@@
        ]
      }
    } else if [type] == "edge-https" {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@PROXYSG_SSL_COLUMNS@@
        ]
      }
# @@PROXYSG_CLOUD_BEGIN@@
    } else if [type] == "cloud" {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@PROXYSG_CLOUD_COLUMNS@@
        ]
      }
# @@PROXYSG_CLOUD_END@@
    }

    # Timestamp policy is determined by the ELFF time field, not by MAIN/SSL/Cloud type.
    #
    # localtime:
    #   The appliance already wrote the wall-clock value in the site's local timezone.
    #   Do not apply a second UTC->local conversion. Interpret that value directly with
    #   the OneClick TIMEZONE so Elasticsearch can normalize it to the correct UTC instant.
    #
    # date + time:
    #   The source value is UTC. Parse as UTC; Kibana later displays @timestamp using
    #   the OneClick TIMEZONE (dateFormat:tz).
    if [localtime] and [localtime] != "-" and [localtime] != "" {
      mutate {
        add_field => { "[@metadata][logtime]" => "%{localtime}" }
      }
      date {
        match => [
          "[@metadata][logtime]",
          "ISO8601",
          "YYYY-MM-dd HH:mm:ss",
          "YYYY-MM-dd HH:mm:ss.SSS",
          "YYYY-MM-ddHH:mm:ss",
          "YYYY-MM-ddHH:mm:ss.SSS",
          "[dd/MMM/yyyy:HH:mm:ss Z]",
          "dd/MMM/yyyy:HH:mm:ss Z"
        ]
        locale => "en"
        timezone => "@@ELK_TIMEZONE@@"
        target => "@timestamp"
      }
      mutate {
        add_field => {
          "event_time_field" => "localtime"
          "event_source_timezone" => "@@ELK_TIMEZONE@@"
          "event_display_timezone" => "@@ELK_TIMEZONE@@"
        }
      }
    } else if [log_date] and [log_time] {
      mutate {
        add_field => { "[@metadata][logtime]" => "%{log_date} %{log_time}" }
      }
      date {
        match => [ "[@metadata][logtime]", "YYYY-MM-dd HH:mm:ss", "YYYY-MM-dd HH:mm:ss.SSS", "ISO8601" ]
        timezone => "UTC"
        target => "@timestamp"
      }
      mutate {
        add_field => {
          "event_time_field" => "date time"
          "event_source_timezone" => "UTC"
          "event_display_timezone" => "@@ELK_TIMEZONE@@"
        }
      }
    }

    mutate {
      convert => {
        "time_taken" => "integer"
        "sc_bytes" => "integer"
        "cs_bytes" => "integer"
      }
      remove_field => [ "message", "localtime", "log_date", "log_time", "[@metadata][logtime]", "@version" ]
    }
  }
}
