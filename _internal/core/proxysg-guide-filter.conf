
# ProxySG MAIN/SSL parser based on the supplied ELK 9.x guide.
# If the actual ProxySG #Fields order differs, disable GUIDE_PROXY_CSV_FILTER_ENABLED
# or adjust this field list to match the deployed access-log format.
filter {
  if [type] == "edge-http" or [type] == "edge-https" {
    if ![message] or [message] =~ /^\s*#/ or [message] =~ /^\s*$/ {
      drop { }
    }

    mutate {
      gsub => [
        "message", "\\\"", "",
        "message", "\\t", " "
      ]
    }

    csv {
      source => "message"
      separator => " "
      autogenerate_column_names => false
      columns => [
        "log_date",
        "log_time",
        "time_taken",
        "c_ip",
        "cs_username",
        "cs_auth_group",
        "s_supplier_name",
        "s_supplier_ip",
        "s_supplier_country",
        "s_supplier_city",
        "s_supplier_state",
        "s_action",
        "cs_referer",
        "cs_url",
        "cs_category",
        "cs_method",
        "cs_content_type",
        "cs_uri_scheme",
        "rs_host",
        "cs_uri_port",
        "cs_uri_path",
        "cs_uri_query",
        "cs_uri_extension",
        "cs_useragent",
        "s_ip",
        "sc_bytes",
        "cs_bytes",
        "sc_filter_result",
        "sc_status",
        "cs_threat_source",
        "cs_threat_id",
        "cs_threat_url",
        "cs_unwanted",
        "cs_bluecoat_application_name",
        "cs_bluecoat_application_operation",
        "cs_bluecoat_application_groups",
        "cs_web_application_name",
        "cs_web_application_operation",
        "cs_web_application_groups",
        "cs_connection_negotiated_cipher_strength",
        "cs_certificate_hostname",
        "cs_certificate_observed_errors",
        "cs_untrusted",
        "x_rs_certificate_hostname_threat_risk",
        "x_bluecoat_access_security_policy_action",
        "x_bluecoat_access_security_policy_reason",
        "x_bluecoat_protection_result"
      ]
    }

    mutate {
      add_field => { "[@metadata][logtime]" => "%{log_date} %{log_time}" }
    }
    date {
      match => [ "[@metadata][logtime]", "YYYY-MM-dd HH:mm:ss", "YYYY-MM-dd HH:mm:ss.SSS" ]
      timezone => "UTC"
      target => "@timestamp"
    }
    mutate {
      convert => {
        "time_taken" => "integer"
        "sc_bytes" => "integer"
        "cs_bytes" => "integer"
      }
      remove_field => [ "message", "log_date", "log_time", "[@metadata][logtime]", "@version" ]
    }
  }
}
