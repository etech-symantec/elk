
# ProxySG MAIN/SSL parser.
# The csv "columns" lists are generated on installation from GUIDE_MAIN_LOG_FORMAT / GUIDE_SSL_LOG_FORMAT
# (the ELFF "#Fields:" order of each log). Change the formats in the Config Wizard (step 7) instead of this file.
# A line that is exactly @@GUIDE_MAIN_COLUMNS@@ or @@GUIDE_SSL_COLUMNS@@ is replaced by that list;
# if you remove those lines and write the columns by hand, this text is used as it is.
filter {
  if [type] == "edge-http" or [type] == "edge-https" {
    if ![message] or [message] =~ /^\s*#/ or [message] =~ /^\s*$/ {
      drop { }
    }

    mutate {
      gsub => [
        "message", "\\\"", "",
        "message", "\\t", " "
      ]
    }

    if [type] == "edge-http" {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@GUIDE_MAIN_COLUMNS@@
        ]
      }
    } else {
      csv {
        source => "message"
        separator => " "
        autogenerate_column_names => false
        columns => [
@@GUIDE_SSL_COLUMNS@@
        ]
      }
    }

    mutate {
      add_field => { "[@metadata][logtime]" => "%{log_date} %{log_time}" }
    }
    date {
      match => [ "[@metadata][logtime]", "YYYY-MM-dd HH:mm:ss", "YYYY-MM-dd HH:mm:ss.SSS" ]
      timezone => "UTC"
      target => "@timestamp"
    }
    mutate {
      convert => {
        "time_taken" => "integer"
        "sc_bytes" => "integer"
        "cs_bytes" => "integer"
      }
      remove_field => [ "message", "log_date", "log_time", "[@metadata][logtime]", "@version" ]
    }
  }
}
