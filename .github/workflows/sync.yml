name: Sync Wizard Embedded Files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wizard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync wizard files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Show target branch
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Run wizard sync
        run: python3 tools/sync_wizard.py

      - name: Verify sync result
        run: python3 tools/sync_wizard.py --check

      - name: Show changed files
        id: changes
        shell: bash
        run: |
          echo "---- git status ----"
          git status --short

          if git diff --quiet -- config-wizard.html SHA256SUMS.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "동기화할 변경 사항이 없습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "config-wizard.html / SHA256SUMS.txt 변경 사항을 커밋합니다."
          fi

      - name: Commit synchronized files
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config-wizard.html SHA256SUMS.txt
          git commit -m "Sync wizard embedded files"

      - name: Push synchronized files
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Final result
        shell: bash
        run: |
          if [[ "${{ steps.changes.outputs.changed }}" == "true" ]]; then
            echo "완료: config-wizard.html 및 SHA256SUMS.txt를 동기화하고 커밋했습니다."
          else
            echo "완료: 이미 동기화된 상태입니다."
          fi
