name: check

# main 브랜치 동기화가 끝난 뒤 검증합니다.
# PR / 수동 실행은 읽기 전용으로 직접 검증합니다.
on:
  workflow_run:
    workflows: ["Sync OneClick release metadata"]
    types: [completed]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (latest synced main or PR)
        uses: actions/checkout@v4
        with:
          # workflow_run SHA는 동기화 이전 SHA이므로 최신 main을 가져옵니다.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

      - name: Version metadata is synchronized
        run: python3 tools/sync_version.py --check

      - name: Wizard embedded files are synchronized
        run: python3 tools/sync_wizard.py --check

      - name: Wizard JavaScript syntax
        run: |
          python3 tools/sync_wizard.py --extract-js /tmp/wizard.js
          node --check /tmp/wizard.js

      - name: Admin defaults file is valid
        run: python3 tools/gen_defaults.py --check

      - name: Patch library matches installer pipeline
        run: bash tools/check_patch_lib.sh

      - name: Version strings match canonical VERSION
        run: python3 tools/check_version.py

      # 검사 전용: git add/commit/push, sync_version.py 또는 sync_wizard.py
      # (수정 모드) 실행은 절대 포함하지 않습니다.
