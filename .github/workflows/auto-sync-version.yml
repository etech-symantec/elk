name: Auto-bump and synchronize OneClick release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oneclick-version-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Advance one release for each changed push and publish synchronized assets
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            echo "--- release sync attempt ${attempt}/5 ---"
            git fetch --no-tags origin main
            git reset --hard origin/main

            # A push should produce one release, not one release per edited file.
            # If main advanced while the workflow waited, still use the latest tree.
            if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
              changed='manual-trigger'
            elif [[ -n "${BEFORE:-}" && "${BEFORE}" != '0000000000000000000000000000000000000000' ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "${BEFORE}" HEAD)"
            elif git rev-parse 'HEAD^' >/dev/null 2>&1; then
              changed="$(git diff --name-only HEAD^ HEAD)"
            else
              changed='initial-push'
            fi
            if [[ -z "$changed" ]]; then
              echo 'No source changes; skipping.'
              exit 0
            fi
            printf 'Changed files:\n%s\n' "$changed"

            python3 tools/auto_bump_version.py --min-version 2.9.56
            python3 tools/sync_release.py
            bash tools/check_patch_lib.sh

            git add -u
            git add _internal/docs/VERSION version.json SHA256SUMS.txt config-wizard.html
            if git diff --cached --quiet; then
              echo 'Already synchronized.'
              exit 0
            fi
            git commit -m 'chore(release): auto-bump OneClick version and synchronize assets [skip ci]'
            if git push origin HEAD:main; then
              echo 'Version and build are synchronized.'
              exit 0
            fi
            if (( attempt == 5 )); then
              echo 'ERROR: unable to push. Check branch protection and Actions write permission.' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
