.ubtn.ziplite{flex:1 1 170px;width:auto;height:40px;background:#fff;color:#1d4ed8;border:1.5px solid #93c5fd;font-size:13px}
.ubtn.ziplite:hover{background:#eff6ff;border-color:#2563eb}
@keyframes heropulse{0%,100%{box-shadow:0 8px 22px rgba(37,99,235,.40)}50%{box-shadow:0 8px 30px rgba(79,70,229,.65)}}
@media (prefers-reduced-motion:reduce){.ubtn.hero{animation:none}}

/* ---- 11단계: 구성 요약 및 검증 결과(좌 1) + 로그 처리 흐름 도표(우 2) ---- */
.sumlayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px;align-items:start;margin-top:14px}
.sumlayout>.summary{margin-top:0}
.sumgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.sumgrid .sum{word-break:break-all}
.sumright{display:flex;flex-direction:column;gap:0}
.flowstrip{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;margin-bottom:10px;padding:9px 10px;border:1px dashed #94a3b8;border-radius:10px;background:#f8fafc}
.fchip{display:inline-block;padding:3px 9px;border-radius:999px;background:#eef2ff;border:1px solid #c7d2fe;font-size:11px;font-weight:800;color:#3730a3}
.fsep{color:#94a3b8;font-size:10px}
.flowcard{border:1px solid #94a3b8;border-radius:11px;background:#fff;padding:10px 12px;box-shadow:0 2px 6px rgba(15,23,42,.10)}
.flowcard h4{margin:0 0 7px;font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.flowcard h4 small{font-size:11px;font-weight:600;color:#64748b}
.fnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#1e293b;color:#fff;font-size:12px}
.ftable{width:100%;border-collapse:collapse;font-size:11.5px;margin:0 0 6px}
.ftable th,.ftable td{padding:4px 7px;border:1px solid #e2e8f0;text-align:left;vertical-align:top;word-break:break-all;line-height:1.55}
.ftable thead th{background:#f1f5f9;color:#475569;font-weight:800}
.ftable tbody th{width:104px;background:#f8fafc;color:#475569;font-weight:700}
.ftable code{font:11px ui-monospace,Consolas,monospace;background:#f1f5f9;padding:0 4px;border-radius:4px;color:#0f172a}
.ftag{display:inline-block;padding:0 7px;border-radius:999px;font-size:10px;font-weight:800}
.ftag.tmain{background:#dbeafe;color:#1d4ed8}
.ftag.tssl{background:#ede9fe;color:#6d28d9}
.fnote{margin-top:4px;padding:5px 8px;border-radius:7px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:11px;line-height:1.55}
.flowarrow{text-align:center;color:#64748b;font-size:11px;margin:5px 0;line-height:1.3}
.flowarrow b{display:block;font-size:15px;color:#2563eb;line-height:1}
@media(max-width:1100px){.sumlayout{grid-template-columns:1fr}}
.sumright .sectitle small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.sumleft .erritem{flex-wrap:wrap}
.sumleft .info{margin-top:12px}

/* ---- Cloud(선택) 항목: 3열 배치, 비활성 표시, 처리할 로그 종류 패널 ---- */
.fields.cols3,.requiredFields.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1180px){.fields.cols3,.requiredFields.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fields.cols3,.requiredFields.cols3{grid-template-columns:1fr}}
.field.cloudoff{opacity:.62;background:#f1f5f9;border-style:dashed;border-color:#94a3b8}
.field.cloudoff.adminfield{background:#f1f5f9;border-color:#94a3b8;box-shadow:none}
.field.cloudoff input,.field.cloudoff textarea{background:#e2e8f0;color:#64748b;cursor:not-allowed}
.offbadge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:900;background:#64748b;color:#fff;margin-left:6px}
.ltpanel{margin:12px 0 6px}
.lthead2{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.lthead2 b{font-size:14px}
.lthead2 small{font-size:11px;color:#64748b}
.ltgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ltcell{border:1px solid #94a3b8;border-radius:11px;padding:10px 12px;background:#fff;box-shadow:0 2px 6px rgba(15,23,42,.10)}
.ltcell.off{background:#f1f5f9;border-style:dashed}
.ltcell .lthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ltstate{font-size:10px;font-weight:900;padding:2px 9px;border-radius:999px}
.ltstate.on{background:#dcfce7;color:#047857}
.ltstate.off{background:#e2e8f0;color:#64748b}
.ltmeta{font-size:11.5px;color:#334155;line-height:1.6;word-break:break-all}
.ltwhy{margin-top:6px;font-size:11px;color:#b45309;line-height:1.5}
.ltsw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.ltsw>span{font-size:11.5px;font-weight:800;color:#0f172a}
.ftag.tcloud{background:#ccfbf1;color:#0f766e}
.ftag.toff{background:#e2e8f0;color:#64748b}
.ftable td.offcell,.ftable th.offcell{background:#f1f5f9;color:#94a3b8}
.foff{font-style:italic;color:#94a3b8;font-weight:700}
@media(max-width:1180px){.ltgrid{grid-template-columns:1fr}}

<script>const DATA={"vars":[{"key":"INSTALL_ELASTICSEARCH","default":"true","section":"1. 설치 제어","help":"기능: Install Elasticsearch 값을 설정합니다.\n왜 필요한가: 어떤 구성요소를 설치하고 어떤 저장소/프록시를 사용할지 결정하는 설치 전역 설정입니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Install Elasticsearch","secret":false,"select":null},{"key":"INSTALL_KIBANA","default":"true","section":"1. 설치 제어","help":"기능: Install Kibana 값을 설정합니다.\n왜 필요한가: 어떤 구성요소를 설치하고 어떤 저장소/프록시를 사용할지 결정하는 설치 전역 설정입니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Install Kibana","secret":false,"select":null},{"key":"INSTALL_LOGSTASH","default":"true","section":"1. 설치 제어","help":"기능: Install Logstash 값을 설정합니다.\n왜 필요한가: 어떤 구성요소를 설치하고 어떤 저장소/프록시를 사용할지 결정하는 설치 전역 설정입니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Install Logstash","secret":false,"select":null},{"key":"ELASTIC_MAJOR","default":"9.x","section":"1. 설치 제어","help":"기능: 설치할 Elastic APT 저장소의 메이저 계열을 선택합니다.\n왜 필요한가: Elasticsearch·Kibana·Logstash는 같은 메이저 계열을 사용하는 것이 버전 호환과 패키지 관리에 가장 안전합니다.\n입력 방법: 현재 이 설치기는 9.x 기준이므로 특별한 이유가 없으면 9.x를 유지합니다.","label":"Elastic 저장소 버전","secret":false,"select":["9.x"]},{"key":"ELASTIC_VERSION","default":"","section":"1. 설치 제어","help":"기능: 설치할 Elasticsearch/Kibana/Logstash의 upstream 버전을 고정합니다.\n왜 필요한가: 운영 서버마다 버전이 달라지는 것을 막고 동일한 절차로 재구축할 수 있게 합니다. Debian 패키지의 실제 버전 문자열에는 epoch/revision(예: 1:9.5.2-1)이 붙을 수 있어 설치기가 APT 목록에서 해당 upstream 버전을 자동 해석합니다.\n입력 방법: 기본값은 빈칸이며, 비워두면 저장소의 최신 9.x 버전을 설치합니다. 특정 버전으로 고정하려면 x.y.z 형식으로 입력하세요(예: 9.5.2 — 입력창의 회색 글씨는 예시일 뿐 실제 값이 아닙니다).","label":"정확한 Elastic 버전","secret":false,"select":null,"placeholder":"9.5.2"},{"key":"APT_REPOSITORY_URL","default":"https://artifacts.elastic.co/packages","section":"1. 설치 제어","help":"기능: Elastic 9.x 패키지를 내려받을 APT 저장소의 기본 URL입니다.\n왜 필요한가: Ubuntu가 elasticsearch/kibana/logstash 패키지를 찾고 업데이트할 수 있게 합니다.\n입력 방법: 인터넷 직접 연결이면 기본값을 유지하고, 사내 패키지 미러가 있으면 그 주소로 변경합니다.","label":"Elastic APT 저장소","secret":false,"select":null},{"key":"APT_GPG_KEY_URL","default":"https://artifacts.elastic.co/GPG-KEY-elasticsearch","section":"1. 설치 제어","help":"기능: Elastic 패키지의 서명을 검증할 GPG 공개키 위치입니다.\n왜 필요한가: APT가 내려받은 패키지가 Elastic에서 서명한 정상 패키지인지 확인하기 위해 필요합니다.\n입력 방법: 공식 저장소를 사용하면 기본 URL을 유지합니다. 사내 미러를 쓸 때만 변경합니다.","label":"Elastic GPG Key URL","secret":false,"select":null},{"key":"APT_PROXY","default":"","section":"1. 설치 제어","help":"기능: Apt Proxy 값을 설정합니다.\n왜 필요한가: 어떤 구성요소를 설치하고 어떤 저장소/프록시를 사용할지 결정하는 설치 전역 설정입니다.\n입력 방법: 선택 기능에서 필요한 값입니다. 해당 기능을 사용하지 않으면 비워둘 수 있으며, 사용 시 실제 운영환경 값으로 입력합니다.","label":"Apt Proxy","secret":false,"select":null},{"key":"HTTP_PROXY","default":"","section":"1. 설치 제어","help":"기능: Http Proxy 값을 설정합니다.\n왜 필요한가: 어떤 구성요소를 설치하고 어떤 저장소/프록시를 사용할지 결정하는 설치 전역 설정입니다.\n입력 방법: 선택 기능에서 필요한 값입니다. 해당 기능을 사용하지 않으면 비워둘 수 있으며, 사용 시 실제 운영환경 값으로 입력합니다.","label":"Http Proxy","secret":false,"select":null},{"key":"HTTPS_PROXY","default":"","section":"1. 설치 제어","help":"기능: Https Proxy 값을 설정합니다.\n왜 필요한가: 어떤 구성요소를 설치하고 어떤 저장소/프록시를 사용할지 결정하는 설치 전역 설정입니다.\n입력 방법: 선택 기능에서 필요한 값입니다. 해당 기능을 사용하지 않으면 비워둘 수 있으며, 사용 시 실제 운영환경 값으로 입력합니다.","label":"Https Proxy","secret":false,"select":null},{"key":"NO_PROXY","default":"127.0.0.1,localhost","section":"1. 설치 제어","help":"기능: No Proxy 값을 설정합니다.\n왜 필요한가: 어떤 구성요소를 설치하고 어떤 저장소/프록시를 사용할지 결정하는 설치 전역 설정입니다.\n입력 방법: 현재 기본값은 127.0.0.1,localhost 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"No Proxy","secret":false,"select":null},{"key":"SET_HOSTNAME","default":"false","section":"2. OS 기본 설정","help":"기능: Set Hostname 값을 설정합니다.\n왜 필요한가: 시간, Hostname, 커널/파일 경로처럼 ELK가 안정적으로 동작하기 위한 Ubuntu 기본 환경을 제어합니다.\n입력 방법: 현재 기본값은 false 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Set Hostname","secret":false,"select":null},{"key":"SYSTEM_HOSTNAME","default":"elk01","section":"2. OS 기본 설정","help":"기능: System Hostname 값을 설정합니다.\n왜 필요한가: 시간, Hostname, 커널/파일 경로처럼 ELK가 안정적으로 동작하기 위한 Ubuntu 기본 환경을 bel":"Install Log","secret":false,"select":null},{"key":"STATE_DIR","default":"/root/.elk-auto-installer","section":"2. OS 기본 설정","help":"기능: State Dir 값을 설정합니다.\n왜 필요한가: 시간, Hostname, 커널/파일 경로처럼 ELK가 안정적으로 동작하기 위한 Ubuntu 기본 환경을 제어합니다.\n입력 방법: 현재 기본값은 /root/.elk-auto-installer 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"State Dir","secret":false,"select":null},{"key":"SECRETS_FILE","default":"/root/.elk-auto-installer/secrets.env","section":"2. OS 기본 설정","help":"기능: Secrets File 값을 설정합니다.\n왜 필요한가: 시간, Hostname, 커널/파일 경로처럼 ELK가 안정적으로 동작하기 위한 Ubuntu 기본 환경을 제어합니다.\n입력 방법: 현재 기본값은 /root/.elk-auto-installer/secrets.env 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Secrets File","secret":false,"select":null},{"key":"BACKUP_DIR","default":"/root/.elk-auto-installer/backups","section":"2. OS 기본 설정","help":"기능: Backup Dir 값을 설정합니다.\n왜 필요한가: 시간, Hostname, 커널/파일 경로처럼 ELK가 안정적으로 동작하기 위한 Ubuntu 기본 환경을 제어합니다.\n입력 방법: 현재 기본값은 /root/.elk-auto-installer/backups 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Backup Dir","secret":false,"select":null},{"key":"INSTALL_PROGRESS_ENABLED","default":"true","section":"2. OS 기본 설정","help":"기능: 설치 중 전체 진행률 막대를 표시합니다.\n왜 필요한가: Elasticsearch처럼 수백 MB 이상인 패키지를 다운로드할 때 화면 출력이 잠시 없어 설치가 멈춘 것처럼 보일 수 있습니다. 전체 진행 단계를 percentage로 계속 확인할 수 있습니다.\n입력 방법: 기본 true 권장. 자동화 로그를 최소화해야 하는 특수 환경에서만 false로 변경합니다.","label":"설치 전체 진행률 표시","secret":false,"select":null},{"key":"INSTALL_PROGRESS_BAR_WIDTH","default":"30","section":"2. OS 기본 설정","help":"기능: 터미널에 표시되는 진행률 막대의 가로 길이를 지정합니다.\n왜 필요한가: 좁은 SSH 창이나 긴 서버 콘솔에서 진행률 표시 폭을 조정할 수 있습니다.\n입력 방법: 30 권장. 10~60 범위가 보기 좋습니다.","label":"진행률 막대 길이","secret":false,"select":null},{"key":"APT_PROGRESS_ENABLED","default":"true","section":"2. OS 기본 설정","help":"기능: APT의 다운로드 및 패키지 설치 percentage를 실시간으로 표시합니다.\n왜 필요한가: Elasticsearch/Kibana/Logstash 패키지는 용량이 커서 네트워크 속도에 따라 오래 걸릴 수 있습니다. 실제 다운로드/설치 상태를 확인할 수 있습니다.\n입력 방법: true 권장. 전체 진행률은 유지하면서 APT 세부 진행률만 숨기려면 false로 변경합니다.","label":"APT 다운로드/설치 상세 진행률","secret":false,"select":null},{"key":"APT_RETRIES","default":"10","section":"2. OS 기본 설정","help":"기능: APT 패키지 다운로드가 일시적인 네트워크 오류로 실패했을 때 자동 재시도하는 횟수입니다.\n왜 필요한가: Elasticsearch/Kibana/Logstash 패키지는 용량이 커서 장시간 다운로드 중 순간적인 네트워크 오류가 발생할 수 있습니다. 재시도를 두면 처음부터 수동으로 다시 시작할 가능성을 줄일 수 있습니다.\n입력 방법: 10 권장. 안정적인 내부망에서는 더 낮춰도 되지만 일반적으로 기본값을 유지합니다.","label":"APT 다운로드 재시도 횟수","secret":false,"select":null},{"key":"APT_CONNECT_TIMEOUT","default":"30","section":"2. OS 기본 설정","help":"기능: APT HTTP/HTTPS 연결의 네트워크 타임아웃(초)을 지정합니다.\n왜 필요한가: 저장소 연결이 끊기거나 응답하지 않을 때 무한정 대기하지 않고 재시도 로직으로 넘어가게 합니다.\n입력 방법: 30초 권장. 느린 프록시/망에서는 60초 정도로 늘릴 수 있습니다.","label":"APT 연결 타임아웃(초)","secret":false,"select":null},{"key":"ES_CLUSTER_NAME","default":"elk-cluster","section":"3. Elasticsearch 기본","help":"기능: Elasticsearch 클러스터의 논리 이름입니다.\n왜 필요한가: 노드와 모니터링 화면에서 어떤 클러스터에 속한 서버인지 구분하며, 멀티노드 구성에서는 같은 클러스터명이 필요합니다.\n입력 방법: 단일 서버라도 운영 환경을 식별할 수 있는 이름을 권장합니다. 예: proxy-log-prod.","label":"Es Cluster Name","secret":false,"select":null},{"key":"ES_NODE_NAME","default":"elk01","section":"3. Elasticsearch 기본","help":"기능: 현재 Elasticsearch 노드의 이름입니다.\n왜 필요한가: 장애·성능·샤드 상태를 확인할 때 서버를 식별하는 기준이 됩니다.\n입력 방법: 서버 Hostname과 맞추거나 elk01처럼 고유한 이름을 사용합니다.","label":"Es Node Name","secret":false,"select":null},{"key":"ES_NETWORK_HOST","default":"0.0.0.0","section":"3. Elasticsearch 기본","help":"기능: Elasticsearch HTTP/Transport 서비스가 바인딩할 네트워크 주소입니다.\n왜 필요한가: 외부 Logstash/Kibana/관리자가 Elasticsearch에 접근할 수 있는 범위를 결정합니다.\n입력 방법: 0.0.0.0을 쓰면 모든 인터페이스에서 수신하므로 방화벽으로 9200 접근을 제한해야 합니다. 같은 서버에서만 쓸 경우 더 제한적인 주소가 안전합니다.","label":"Elasticsearch Listen 주소","secret":false,"select":null},{"key":"ES_HTTP_PORT","default":"9200","section":"3. Elasticsearch 기본","help":"기능: Elasticsearch REST API가 수신할 HTTPS 포트입니다.\n왜 필요한가: Kibana·Logstash·운영 스크립트가 Elasticsearch API에 연결할 때 사용합니다.\n입력 방법: 기본 9200을 권장합니다. 변경하면 Kibana/Logstash/방화벽 설정도 같은 값으로 맞춰야 합니다.","label":"Elasticsearch HTTPS 포트","secret":false,"select":null},{"key":"ES_TRANSPORT_PORT","default":"9300","section":"3. Elasticsearch 기본","help":"기능: Es Transport Port 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 현재 기본값은 9300 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Transport Port","secret":false,"select":null},{"key":"ES_ACTION_DESTRUCTIVE_REQUIRES_NAME","default":"true","section":"3. Elasticsearch 기본","help":"기능: 삭제 같은 파괴적 API에서 명시적인 인덱스 이름을 강제할지 결정합니다.\n왜 필요한가: 실수로 * 또는 _all을 사용해 여러 인덱스를 삭제하는 사고를 줄이는 안전장치입니다.\n입력 방법: 운영은 true 권장. 빠른 설정의 초기값은 false이므로 사용 시 특히 주의합니다.","label":"Wildcard 파괴 작업 허용","secret":false,"select":null},{"key":"ES_PATH_DATA","default":"/var/lib/elasticsearch","section":"3. Elasticsearch 기본","help":"기능: Elasticsearch 인덱스와 샤드 데이터가 실제로 저장될 디스크 경로입니다.\n왜 필요한가: 90일 보관 시 가장 많은 용량을 사용하는 핵심 경로이며 OS 디스크와 분리할지 결정해야 합니다.\n입력 방법: 전용 데이터 디스크가 있으면 마운트 경로(예: /data/elasticsearch)로 변경합니다. 기본 OS 디스크를 사용할 때만 /var/lib/elasticsearch를 유지합니다.","label":"Elasticsearch 데이터 저장 경로","secret":false,"select":null},{"key":"ES_PATH_LOGS","default":"/var/log/elasticsearch","section":"3. Elasticsearch 기본","help":"기능: Elasticsearch 자체 서비스 로그가 저장되는 경로입니다.\n왜 필요한가: Elasticsearch 장애 원인과 GC/서비스 오류를 추적할 때 필요합니다.\n입력 방법: 특별한 로그 파티션 정책이 없다면 /var/log/elasticsearch 기본값을 유지합니다.","label":"Elasticsearch 서비스 로그 경로","secret":false,"select":null},{"key":"ES_DISCOVERY_MODE","default":"single-node","section":"3. Elasticsearch 기본","help":"현재 설치기는 single-node 자동구성을 완전 지원. multi-node는 discovery 변수까지 출력하지만 노드 간 Transport TLS 인증서 배포는 별도 설계 필요.","label":"Es Discovery Mode","secret":false,"select":["single-node","multi-node"]},{"key":"ES_DISCOVERY_SEED_HOSTS","default":"","section":"3. Elasticsearch 기본","help":"기능: Es Discovery Seed Hosts 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 선택 기능에서 필요한 값입니다. 해당 기능을 사용하지 않으면 비워둘 수 있으며, 사용 시 실제 운영환경 값으로 입력합니다.","label":"Es Discovery Seed Hosts","secret":false,"select":null},{"key":"ES_CLUSTER_INITIAL_MASTER_NODES","default":"","section":"3. Elasticsearch 기본","help":"기능: Es Cluster Initial Master Nodes 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 선택 기능에서 필요한 값입니다. 해당 기능을 사용하지 않으면 비워둘 수 있으며, 사용 시 실제 운영환경 값으로 입력합니다.","label":"Es Cluster Initial Master Nodes","secret":false,"select":null},{"key":"ES_SECURITY_ENABLED","default":"true","section":"3. Elasticsearch 기본","help":"자동 보안/TLS 사용. 9.x 기본 보안 구성을 그대로 활용.","label":"Es Security Enabled","secret":false,"select":null},{"key":"ES_ENROLLMENT_ENABLED","default":"true","section":"3. Elasticsearch 기본","help":"기능: Es Enrollment Enabled 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Enrollment Enabled","secret":false,"select":null},{"key":"ES_HTTP_TLS_ENABLED","default":"true","section":"3. Elasticsearch 기본","help":"기능: Es Http Tls Enabled 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Http Tls Enabled","secret":false,"select":null},{"key":"ES_TRANSPORT_TLS_ENABLED","default":"true","section":"3. Elasticsearch 기본","help":"기능: Es Transport Tls Enabled 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Transport Tls Enabled","secret":false,"select":null},{"key":"ELASTIC_USERNAME","default":"elastic","section":"3. Elasticsearch 기본","help":"기능: Elasticsearch 최고 관리자(superuser) 계정의 ID입니다. 설치기가 Elasticsearch API를 호출하고 관리자 비밀번호를 설정할 때 이 계정으로 인증합니다.\n주의: Elasticsearch 내장 계정 elastic은 이름을 바꾸거나 삭제할 수 없습니다. 신규 설치에서는 반드시 elastic을 사용해야 하며, 다른 이름은 같은 이름의 superuser가 이미 있는 기존 클러스터에 재배포할 때만 사용할 수 있습니다.\n입력 방법: 대부분 기본값 elastic 그대로 두세요. 사람이 Kibana에 로그인해 쓸 별도 관리자 계정이 필요하면 03 Kibana에서 '초기 사용자 자동 생성'을 켜고 Role에 superuser를 지정하세요.","label":"Elasticsearch 관리자 ID","secret":false,"select":null},{"key":"ELASTIC_PASSWORD","default":"","section":"3. Elasticsearch 기본","help":"기능: 내장 관리자 계정 elastic의 비밀번호입니다.\n왜 필요한가: 초기 관리, API 점검, 계정/Role 생성 등 최고 권한 작업에 사용되므로 반드시 안전하게 관리해야 합니다.\n입력 방법: 직접 정할 수 있고, 비워두면 설치기가 강한 비밀번호를 자동 생성하여 /root/.elk-auto-installer/secrets.env에 저장합니다.\n입력 조건: 비워두면 강한 비밀번호를 자동 생성합니다. 직접 입력할 경우 Elasticsearch 정책상 최소 6자 이상이어야 하며, 6자 미만이면 설치 파일 생성 단계에서 차단됩니다.","label":"elastic 관리자 비밀번호","secret":true,"select":null},{"key":"ES_HEAP_MODE","default":"auto","section":"3. Elasticsearch 기본","help":"기능: Elasticsearch JVM Heap을 자동 계산할지 직접 지정할지 선택합니다.\n왜 필요한가: Heap은 검색/인덱싱 성능과 OOM 위험에 직접 영향을 줍니다.\n입력 방법: 일반적으로 auto 권장. 서버 메모리 정책이 정해져 있을 때만 fixed를 사용합니다. 테스트 VM에서 512m처럼 작게 고정하는 것은 장애 대응용 임시값입니다.","label":"Elasticsearch Heap 방식","secret":false,"select":["auto","fixed"]},{"key":"ES_HEAP_MIN","default":"16g","section":"3. Elasticsearch 기본","help":"기능: fixed 모드에서 JVM 최소 Heap(Xms)을 지정합니다.\n왜 필요한가: JVM 메모리가 실행 중 크게 변하지 않게 하여 GC와 성능 변동을 줄입니다.\n입력 방법: fixed를 선택했을 때만 적용되며 Xmx와 같은 값으로 설정하는 것을 권장합니다.","label":"Elasticsearch Xms","secret":false,"select":null},{"key":"ES_HEAP_MAX","default":"16g","section":"3. Elasticsearch 기본","help":"기능: fixed 모드에서 JVM 최대 Heap(Xmx)을 지정합니다.\n왜 필요한가: Elasticsearch가 사용할 JVM 메모리 상한을 결정합니다. 너무 크면 OS 파일 캐시가 부족하고, 너무 작으면 503/OOM이 발생할 수 있습니다.\n입력 방법: fixed를 선택했을 때만 적용되며 Xms와 동일하게 지정합니다.","label":"Elasticsearch Xmx","secret":false,"select":null},{"key":"ES_BOOTSTRAP_MEMORY_LOCK","default":"false","section":"3. Elasticsearch 기본","help":"메모리 잠금. DISABLE_SWAP=true인 경우 보통 false로도 충분.","label":"Es Bootstrap Memory Lock","secret":false,"select":null},{"key":"ES_LIMIT_NOFILE","default":"65535","section":"3. Elasticsearch 기본","help":"기능: Es Limit Nofile 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 현재 기본값은 65535 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Limit Nofile","secret":false,"select":null},{"key":"ES_LIMIT_NPROC","default":"4096","section":"3. Elasticsearch 기본","help":"기능: Es Limit Nproc 값을 설정합니다.\n왜 필요한가: Elasticsearch 노드의 네트워크, 저장소, 보안, 메모리 및 클러스터 동작을 제어합니다.\n입력 방법: 현재 기본값은 4096 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Limit Nproc","secret":false,"select":null},{"key":"ES_EXTRA_CONFIG_FILE","default":"","section":"3. Elasticsearch 기본","help":"Elasticsearch 추가 YAML을 파일로 주입하고 싶을 때 예: /root/elk-extra/elasticsearch-extra.yml","label":"Es Extra Config File","secret":false,"select":null},{"key":"ES_DISK_WATERMARK_LOW","default":"85%","section":"4. Elasticsearch 디스크 보호 설정","help":"비워두면 Elastic 기본값 사용(기본 low/high/flood는 일반적으로 85/90/95%).","label":"Es Disk Watermark Low","secret":false,"select":null},{"key":"ES_DISK_WATERMARK_HIGH","default":"90%","section":"4. Elasticsearch 디스크 보호 설정","help":"기능: Es Disk Watermark High 값을 설정합니다.\n왜 필요한가: 디스크 사용량이 위험 수준에 도달했을 때 샤드 배치/쓰기 제한으로 디스크 고갈을 방지합니다.\n입력 방법: 현재 기본값은 90% 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Disk Watermark High","secret":false,"select":null},{"key":"ES_DISK_WATERMARK_FLOOD_STAGE","default":"95%","section":"4. Elasticsearch 디스크 보호 설정","help":"기능: Es Disk Watermark Flood Stage 값을 설정합니다.\n왜 필요한가: 디스크 사용량이 위험 수준에 도달했을 때 샤드 배치/쓰기 제한으로 디스크 고갈을 방지합니다.\n입력 방법: 현재 기본값은 95% 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Disk Watermark Flood Stage","secret":false,"select":null},{"key":"ES_CLUSTER_INFO_UPDATE_INTERVAL","default":"30s","section":"4. Elasticsearch 디스크 보호 설정","help":"기능: Es Cluster Info Update Interval 값을 설정합니다.\n왜 필요한가: 디스크 사용량이 위험 수준에 도달했을 때 샤드 배치/쓰기 제한으로 디스크 고갈을 방지합니다.\n입력 방법: 현재 기본값은 30s 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Es Cluster Info Update Interval","secret":false,"select":null},{"key":"KIBANA_SERVER_NAME","default":"elk-kibana","section":"5. Kibana","help":"기능: Kibana Server Name 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 elk-kibana 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Server Name","secret":false,"select":null},{"key":"KIBANA_SERVER_HOST","default":"0.0.0.0","section":"5. Kibana","help":"기능: Kibana 웹 서버가 바인딩할 주소입니다.\n왜 필요한가: 브라우저가 5601로 직접 접속할지, Nginx만 로컬 Kibana에 접속할지를 결정합니다.\n입력 방법: 직접 접속은 0.0.0.0, Nginx Reverse Proxy를 사용할 때는 127.0.0.1 사용을 권장합니다.","label":"Kibana Listen 주소","secret":false,"select":null},{"key":"KIBANA_SERVER_PORT","default":"5601","section":"5. Kibana","help":"기능: Kibana 웹 UI의 내부 서비스 포트입니다.\n왜 필요한가: Nginx 또는 사용자의 브라우저가 Kibana에 연결할 때 사용합니다.\n입력 방법: 기본 5601 권장. 변경 시 Nginx proxy_pass 및 방화벽과 동일하게 맞춥니다.","label":"Kibana 포트","secret":false,"select":null},{"key":"KIBANA_LOGIN_ENABLED","default":"true","section":"5. Kibana","label":"Kibana 로그인 사용","secret":false,"select":null,"help":"기능: Kibana 접속 시 로그인(ID/비밀번호)을 요구할지 정합니다.\n왜 필요한가: 로그인을 '사용 안 함'으로 하면 별도 계정 없이 브라우저로 바로 Kibana를 열 수 있어, 내부망 조회용 대시보드 같은 용도에 편합니다.\n입력 방법: 기본은 사용(ON)입니다. 끄면(OFF) Kibana의 익명(anonymous) 인증을 사용해 읽기 전용 계정 kibana_anonymous(Role: viewer)로 접속되며, 이 계정은 모든 인덱스를 조회할 수 있습니다. 끈 경우에도 로그인 화면에서 elastic 등 다른 계정으로 로그인할 수 있습니다. 반드시 방화벽(UFW) 허용 대역을 신뢰 가능한 내부망으로 제한하세요. Elasticsearch 보안(ES_SECURITY_ENABLED)이 꺼져 있으면 이 설정은 적용되지 않습니다."},{"key":"KIBANA_SESSION_IDLE_TIMEOUT","default":"","placeholder":"8h","section":"5. Kibana","label":"로그인 세션 유휴 만료","secret":false,"select":null,"help":"기능: 로그인한 사용자가 활동하지 않을 때 세션을 자동 만료시키는 시간입니다.\n왜 필요한가: 자리를 비운 사이 열려 있는 Kibana 세션을 닫아 보안을 높입니다.\n입력 방법: 숫자+단위 형식(ms, s, m, h, d, w, M, Y)으로 입력합니다. 예: 30m, 8h, 7d. 기본값은 빈칸이며 비워두면 Kibana 기본값을 그대로 사용합니다. 로그인 사용을 끄면 적용되지 않아 화면에서 숨겨집니다."},{"key":"KIBANA_PUBLIC_BASE_URL","default":"","section":"5. Kibana","help":"외부 URL이 정해져 있으면 예: https://elk.example.com:5601, 아니면 비움","label":"Kibana Public Base Url","secret":false,"select":null},{"key":"KIBANA_ES_HOST","default":"","section":"5. Kibana","help":"비우면 로컬 Elasticsearch의 최종 HTTP/HTTPS URL을 자동 사용","label":"Kibana Es Host","secret":false,"select":null},{"key":"KIBANA_ES_SSL_VERIFICATION_MODE","default":"full","section":"5. Kibana","help":"기능: Kibana Es Ssl Verification Mode 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 full 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Es Ssl Verification Mode","secret":false,"select":["full","certificate","none"]},{"key":"KIBANA_SERVICE_TOKEN_NAME","default":"elk-auto-kibana","section":"5. Kibana","help":"기능: Kibana Service Token Name 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 elk-auto-kibana 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Service Token Name","secret":false,"select":null},{"key":"KIBANA_SECURITY_ENCRYPTION_KEY","default":"","section":"5. Kibana","help":"비워두면 자동 생성 후 Kibana keystore에 저장\n입력 조건: 비워두면 자동 생성합니다. 직접 입력할 경우 최소 32자 이상이어야 합니다.","label":"Kibana Security Encryption Key","secret":true,"select":null},{"key":"KIBANA_REPORTING_ENCRYPTION_KEY","default":"","section":"5. Kibana","help":"기능: Kibana Reporting Encryption Key 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 보안정보이므로 가능한 경우 비워 자동 생성하거나 조직의 비밀번호 정책에 맞는 값을 입력하고 공유를 제한합니다.\n입력 조건: 비워두면 자동 생성합니다. 직접 입력할 경우 최소 32자 이상이어야 합니다.","label":"Kibana Reporting Encryption Key","secret":true,"select":null},{"key":"KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY","default":"","section":"5. Kibana","help":"기능: Kibana Saved Objects Encryption Key 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 보안정보이므로 가능한 경우 비워 자동 생성하거나 조직의 비밀번호 정책에 맞는 값을 입력하고 공유를 제한합니다.\n입력 조건: 비워두면 자동 생성합니다. 직접 입력할 경우 최소 32자 이상이어야 합니다.","label":"Kibana Saved Objects Encryption Key","secret":true,"select":null},{"key":"KIBANA_LOG_LEVEL","default":"info","section":"5. Kibana","help":"기능: Kibana Log Level 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 info 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Log Level","secret":false,"select":null},{"key":"KIBANA_CREATE_DATA_VIEW","default":"true","section":"5. Kibana","help":"기능: Kibana Create Data View 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Create Data View","secret":false,"select":null},{"key":"KIBANA_DATA_VIEW_NAME","default":"ELK Logs","section":"5. Kibana","help":"기능: Kibana Data View Name 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 ELK Logs 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Data View Name","secret":false,"select":null},{"key":"KIBANA_DATA_VIEW_TIME_FIELD","default":"@timestamp","section":"5. Kibana","help":"기능: Kibana Data View Time Field 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 @timestamp 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Data View Time Field","secret":false,"select":null},{"key":"KIBANA_DATA_VIEW_ALLOW_NO_INDEX","default":"true","section":"5. Kibana","help":"기능: Kibana Data View Allow No Index 값을 설정합니다.\n왜 필요한가: Kibana 웹 UI의 접속, Elasticsearch 연결, 보안 키와 초기 사용자/데이터뷰를 설정합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Kibana Data View Allow No Index","secret":false,"select":null},{"key":"KIBANA_CREATE_INITIAL_USER","default":"false","section":"5. Kibana","help":"기능: 설치 완료 후 Kibana 로그인용 별도 사용자를 자동 생성합니다.\n왜 필요한가: elastic 최고 관리자 계정을 일상적인 웹 로그인에 계속 사용하는 것을 줄일 수 있습니다.\n입력 방법: 운영용 관리자/조회 전용 계정을 별도로 만들고 싶으면 '사용'을 선택합니다. '사용 안 함'이면 초기 로그인은 elastic 계정을 사용할 수 있습니다.","label":"초기 사용자 자동 생성","secret":false,"select":null},{"key":"KIBANA_INITIAL_USER_NAME","default":"","section":"5. Kibana","help":"기능: 자동 생성할 Kibana/Elasticsearch 사용자의 로그인 ID입니다.\n왜 필요한가: 운영자별 계정을 분리하면 감사·권한 관리가 쉬워집니다.\n입력 방법: 초기 사용자 자동 생성이 켜져 있을 때 회사 계정 정책에 맞는 고유 ID를 입력합니다.","label":"초기 사용자 ID","secret":false,"select":null},{"key":"KIBANA_INITIAL_USER_PASSWORD","default":"","section":"5. Kibana","help":"기능: 초기 Kibana 사용자의 비밀번호입니다.\n왜 필요한가: 웹 UI와 Elasticsearch 권한 접근에 사용되는 인증정보입니다.\n입력 방법: 직접 입력하거나 비워두어 자동 생성할 수 있습니다. 생성된 값은 root 전용 secrets 파일에서 확인합니다.\n입력 조건: 초기 Kibana 사용자를 생성할 때 비워두면 자동 생성합니다. 직접 입력할 경우 최소 6자 이상이어야 합니다.","label":"초기 사용자 비밀번호","secret":true,"select":null},{"key":"KIBANA_INITIAL_USER_ROLES","default":"viewer","section":"5. Kibana","help":"기능: 초기 Kibana 사용자에게 부여할 Elasticsearch/Kibana 내장 Role을 드롭다운에서 선택합니다.\n왜 필요한가: Role에 따라 조회·편집·관리 가능 범위가 달라집니다.\n입력 방법: 로그를 보기만 하면 viewer, 대시보드를 만들고 고치려면 editor, 로그인 계정을 별도 관리자로 쓰려면 superuser를 선택합니다. kibana_admin은 Kibana 설정 관리 권한만 있고 데이터 인덱스를 읽는 권한은 없으므로, 로그 조회가 필요하면 viewer나 editor를 함께 고려하세요. 지금 목록에 없는 Role은 설치 후 Kibana에서 사용자에게 추가할 수 있습니다.","label":"초기 사용자 Role","secret":false,"select":["viewer","editor","kibana_admin","superuser"],"optionLabels":{"viewer":"viewer — 조회 전용 (모든 인덱스 읽기, Kibana 읽기 전용)","editor":"editor — 편집 가능 (대시보드·Data View 등 편집, 인덱스 읽기)","kibana_admin":"kibana_admin — Kibana 관리 (Kibana 기능 전체, 데이터 인덱스 읽기 권한은 없음)","superuser":"superuser — 최고 관리자 (전체 권한, 꼭 필요한 계정에만)"}},{"key":"KIBANA_EXTRA_CONFIG_FILE","default":"","section":"5. Kibana","help":"기능: 서버에 이미 있는 설정 파일의 내용을 kibana.yml 맨 끝에 그대로 덧붙입니다.\n왜 필요한가: 설치기가 만들지 않는 Kibana 옵션(보고서, 알림 등)을 직접 추가하기 위해서입니다.\n입력 방법: 비우면 사용하지 않습니다. 입력한 경로의 파일이 설치 시점에 서버에 없으면 설치가 중단됩니다. kibana.yml 자체의 위치(/etc/kibana/kibana.yml)는 Kibana 패키지가 읽는 고정 경로라 바꿀 수 없습니다.","label":"Kibana 추가 설정 파일 경로","secret":false,"select":null},{"key":"INSTALL_NGINX","default":"false","section":"5A. Nginx HTTPS (선택)","help":"기능: Kibana 앞단에 Nginx Reverse Proxy와 HTTPS 종단을 설치합니다.\n왜 필요한가: Kibana의 5601 포트를 직접 노출하지 않고 표준 HTTPS 443으로 접속하게 할 수 있습니다.\n입력 방법: HTTPS 접속을 원하면 '사용'을 선택하세요. 내부 테스트에서 http://IP:5601로 충분하면 '사용 안 함'으로 두면 됩니다.","label":"Nginx HTTPS 사용","secret":false,"select":null},{"key":"NGINX_SERVER_NAME","default":"_","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx Server Name 값을 설정합니다.\n왜 필요한가: Kibana 앞단의 HTTPS, 인증서, Reverse Proxy 및 접속 URL을 설정합니다.\n입력 방법: 현재 기본값은 _ 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Nginx Server Name","secret":false,"select":null},{"key":"NGINX_HTTP_PORT","default":"80","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx가 평문 HTTP 요청을 받을 포트입니다.\n왜 필요한가: HTTP 요청을 HTTPS로 리다이렉트하거나 별도 HTTP 서비스 정책을 적용하는 데 사용합니다.\n입력 방법: 일반적으로 80 유지. 다른 웹 서비스가 이미 사용 중이면 변경합니다.","label":"Nginx HTTP 포트","secret":false,"select":null},{"key":"NGINX_HTTPS_PORT","default":"443","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx가 HTTPS 요청을 받을 포트입니다.\n왜 필요한가: 사용자가 브라우저에서 Kibana에 암호화된 연결로 접속할 때 사용합니다.\n입력 방법: 일반적으로 443 유지. 변경 시 사용자가 URL에 포트를 명시해야 합니다.","label":"Nginx HTTPS 포트","secret":false,"select":null},{"key":"NGINX_REDIRECT_HTTP_TO_HTTPS","default":"true","section":"5A. Nginx HTTPS (선택)","help":"기능: HTTP 요청을 HTTPS로 301 리다이렉트할지 결정합니다.\n왜 필요한가: 사용자가 실수로 http://로 접속해도 암호화된 HTTPS로 전환시켜 평문 접속을 줄입니다.\n입력 방법: Nginx HTTPS를 사용하는 운영 환경에서는 사용을 권장합니다.","label":"HTTP → HTTPS Redirect","secret":false,"select":null},{"key":"NGINX_DISABLE_DEFAULT_SITE","default":"true","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx Disable Default Site 값을 설정합니다.\n왜 필요한가: Kibana 앞단의 HTTPS, 인증서, Reverse Proxy 및 접속 URL을 설정합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Nginx Disable Default Site","secret":false,"select":null},{"key":"NGINX_PROXY_HOST","default":"127.0.0.1","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx Proxy Host 값을 설정합니다.\n왜 필요한가: Kibana 앞단의 HTTPS, 인증서, Reverse Proxy 및 접속 URL을 설정합니다.\n입력 방법: 현재 기본값은 127.0.0.1 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Nginx Proxy Host","secret":false,"select":null},{"key":"NGINX_PROXY_PORT","default":"","section":"5A. Nginx HTTPS (선택)","help":"비우면 KIBANA_SERVER_PORT 사용","label":"Nginx Proxy Port","secret":false,"select":null},{"key":"NGINX_CLIENT_MAX_BODY_SIZE","default":"100m","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx Client Max Body Size 값을 설정합니다.\n왜 필요한가: Kibana 앞단의 HTTPS, 인증서, Reverse Proxy 및 접속 URL을 설정합니다.\n입력 방법: 현재 기본값은 100m 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Nginx Client Max Body Size","secret":false,"select":null},{"key":"NGINX_TLS_MODE","default":"selfsigned","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx가 사용할 서버 인증서를 자동 생성할지 기존 인증서를 사용할지 선택합니다.\n왜 필요한가: HTTPS 연결에는 인증서와 개인키가 필요합니다.\n입력 방법: 테스트는 selfsigned, 운영은 사내 CA/공인 인증서가 있다면 existing을 권장합니다.","label":"Nginx 인증서 방식","secret":false,"select":["selfsigned","existing"]},{"key":"NGINX_TLS_CERT_FILE","default":"/etc/ssl/certs/kibana-selfsigned.crt","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx가 읽을 서버 인증서 파일 경로입니다.\n왜 필요한가: Nginx의 ssl_certificate 지시어에 사용됩니다.\n입력 방법: selfsigned는 설치기가 이 경로에 생성합니다. existing이면 실제 인증서 경로로 변경합니다.","label":"Nginx Tls Cert File","secret":false,"select":null},{"key":"NGINX_TLS_KEY_FILE","default":"/etc/ssl/private/kibana-selfsigned.key","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx HTTPS 인증서의 개인키 파일 경로입니다.\n왜 필요한가: TLS 핸드셰이크에서 서버가 인증서의 소유자임을 증명하는 데 필요합니다.\n입력 방법: existing 사용 시 인증서와 짝이 맞는 개인키 경로를 입력하고 파일 권한을 제한합니다.","label":"Nginx Tls Key File","secret":false,"select":null},{"key":"NGINX_TLS_CN","default":"","section":"5A. Nginx HTTPS (선택)","help":"기능: Self-Signed 인증서의 CN과 SAN에 넣을 서버 IP 또는 FQDN입니다.\n왜 필요한가: 브라우저가 접속한 주소와 인증서의 이름이 일치해야 이름 불일치 경고를 피할 수 있습니다.\n입력 방법: Nginx Self-Signed 사용 시 실제 사용자가 접속할 IP/FQDN을 반드시 입력합니다.","label":"인증서 CN / SAN","secret":false,"select":null},{"key":"NGINX_TLS_DAYS","default":"3650","section":"5A. Nginx HTTPS (선택)","help":"기능: 자동 생성하는 Self-Signed 인증서의 유효기간입니다.\n왜 필요한가: 기간이 지나면 HTTPS 인증서가 만료되어 브라우저 경고 또는 접속 문제가 발생합니다.\n입력 방법: 기본값은 3650일입니다. 조직 인증서 정책이 있으면 그 정책에 맞춰 조정합니다.","label":"Self-Signed 유효기간","secret":false,"select":null},{"key":"NGINX_TLS_PROTOCOLS","default":"TLSv1.2 TLSv1.3","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx Tls Protocols 값을 설정합니다.\n왜 필요한가: Kibana 앞단의 HTTPS, 인증서, Reverse Proxy 및 접속 URL을 설정합니다.\n입력 방법: 현재 기본값은 TLSv1.2 TLSv1.3 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Nginx Tls Protocols","secret":false,"select":null},{"key":"NGINX_TLS_CIPHERS","default":"HIGH:!aNULL:!MD5","section":"5A. Nginx HTTPS (선택)","help":"기능: Nginx Tls Ciphers 값을 설정합니다.\n왜 필요한가: Kibana 앞단의 HTTPS, 인증서, Reverse Proxy 및 접속 URL을 설정합니다.\n입력 방법: 현재 기본값은 HIGH:!aNULL:!MD5 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Nginx Tls Ciphers","secret":false,"select":null},{"key":"LOGSTASH_NODE_NAME","default":"elk-logstash","section":"6. Logstash 기본","help":"기능: Logstash Node Name 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 elk-logstash 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Node Name","secret":false,"select":null},{"key":"LOGSTASH_PATH_DATA","default":"/var/lib/logstash","section":"6. Logstash 기본","help":"기능: Logstash Path Data 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 /var/lib/logstash 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Path Data","secret":false,"select":null},{"key":"LOGSTASH_PATH_LOGS","default":"/var/log/logstash","section":"6. Logstash 기본","help":"기능: Logstash Path Logs 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 /var/log/logstash 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Path Logs","secret":false,"select":null},{"key":"LOGSTASH_PIPELINE_ID","default":"main","section":"6. Logstash 기본","help":"기능: Logstash Pipeline Id 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 main 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Pipeline Id","secret":false,"select":null},{"key":"LOGSTASH_PIPELINE_FILE","default":"/etc/logstash/conf.d/10-main.conf","section":"6. Logstash 기본","help":"기능: 설치기가 만든 Logstash 파이프라인(입력 → 필터 → 출력)을 저장하는 파일 경로입니다.\n왜 필요한가: Logstash는 /etc/logstash/pipelines.yml에 적힌 /etc/logstash/conf.d/*.conf 파일만 읽습니다.\n입력 방법: 현재 기본값은 /etc/logstash/conf.d/10-main.conf 입니다. 경로는 /etc/logstash/conf.d/ 바로 아래의 .conf 파일이어야 합니다. 그 밖의 위치나 확장자는 Logstash가 읽지 않으므로 설치 전 검사에서 막습니다. 파일 이름만 바꾸는 것(예: 20-proxy.conf)은 안전합니다.","label":"Logstash 파이프라인 설정 파일(.conf) 경로","secret":false,"select":null},{"key":"LOGSTASH_PROFILE","default":"generic","section":"6. Logstash 기본","help":"기능: 설치기가 생성할 Logstash Pipeline 유형을 선택합니다.\n왜 필요한가: 입력 파일 형식과 필터·인덱스 출력 방식이 프로필에 따라 달라집니다.\n입력 방법: ProxySG 로그 처리 구조(MAIN·SSL·Cloud)를 쓰려면 proxysg를 사용합니다.","label":"Logstash Pipeline 프로필","secret":false,"select":["generic","proxysg"]},{"key":"LOGSTASH_HEAP_MIN","default":"2g","section":"6. Logstash 기본","help":"기능: Logstash JVM 최소 Heap(Xms)입니다.\n왜 필요한가: 필터 처리량과 Persistent Queue/플러그인 동작 시 필요한 메모리를 확보합니다.\n입력 방법: 서버 RAM과 로그량을 고려하며 Xmx와 같은 값으로 맞추는 것을 권장합니다.","label":"Logstash Xms","secret":false,"select":null},{"key":"LOGSTASH_HEAP_MAX","default":"2g","section":"6. Logstash 기본","help":"기능: Logstash JVM 최대 Heap(Xmx)입니다.\n왜 필요한가: 대량 로그 처리 시 Logstash 메모리 상한을 정해 시스템 전체 메모리 고갈을 방지합니다.\n입력 방법: Xms와 동일하게 설정하고, Elasticsearch가 사용할 메모리와 OS 여유 메모리를 함께 고려합니다.","label":"Logstash Xmx","secret":false,"select":null},{"key":"LOGSTASH_PIPELINE_WORKERS","default":"0","section":"6. Logstash 기본","help":"Pipeline 튜닝. 0이면 Logstash 기본값(일반적으로 CPU core 수)을 사용하도록 생략.","label":"Logstash Pipeline Workers","secret":false,"select":null},{"key":"LOGSTASH_PIPELINE_BATCH_SIZE","default":"125","section":"6. Logstash 기본","help":"기능: Logstash Pipeline Batch Size 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 125 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Pipeline Batch Size","secret":false,"select":null},{"key":"LOGSTASH_PIPELINE_BATCH_DELAY","default":"50","section":"6. Logstash 기본","help":"기능: Logstash Pipeline Batch Delay 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 50 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Pipeline Batch Delay","secret":false,"select":null},{"key":"LOGSTASH_CONFIG_RELOAD_AUTOMATIC","default":"true","section":"6. Logstash 기본","help":"기능: Logstash Config Reload Automatic 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Config Reload Automatic","secret":false,"select":null},{"key":"LOGSTASH_CONFIG_RELOAD_INTERVAL","default":"3s","section":"6. Logstash 기본","help":"기능: Logstash Config Reload Interval 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 3s 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Config Reload Interval","secret":false,"select":null},{"key":"LOGSTASH_QUEUE_TYPE","default":"persisted","section":"6. Logstash 기본","help":"기능: Logstash Queue Type 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 persisted 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Queue Type","secret":false,"select":null},{"key":"LOGSTASH_QUEUE_MAX_BYTES","default":"4gb","section":"6. Logstash 기본","help":"기능: Logstash Queue Max Bytes 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 4gb 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Queue Max Bytes","secret":false,"select":null},{"key":"LOGSTASH_QUEUE_PAGE_CAPACITY","default":"64mb","section":"6. Logstash 기본","help":"기능: Logstash Queue Page Capacity 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, Pipeline, Elasticsearch 출력 연결을 제어합니다.\n입력 방법: 현재 기본값은 64mb 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Logstash Queue Page Capacity","secret":false,"select":null},{"key":"LOGSTASH_QUEUE_DRAIN","default":"false","section":"6. Logstash 기본","help":"기능: Logstash Queue Drain 값을 설정합니다.\n왜 필요한가: Logstash JVM, Queue, P "label":"Ftp Listen Address","secret":false,"select":null},{"key":"FTP_LISTEN_PORT","default":"21","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Listen Port 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 21 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Listen Port","secret":false,"select":null},{"key":"FTP_USER","default":"elkftp","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP 로그인에 사용할 로컬 계정 이름입니다.\n왜 필요한가: 로그 송신 장비가 인증할 계정이며 업로드 파일의 소유권에도 영향을 줍니다.\n입력 방법: 장비 설정과 동일한 계정을 입력합니다. 기본값은 elkftp입니다.","label":"FTP 계정","secret":false,"select":null},{"key":"FTP_PASSWORD","default":"","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP 계정의 로그인 비밀번호입니다.\n왜 필요한가: 로그 송신 장비가 FTP 서버에 인증할 때 필요합니다.\n입력 방법: 직접 입력하거나 비워두어 강한 비밀번호를 자동 생성할 수 있습니다. 설치 후 secrets.env에서 확인합니다.\n입력 조건: 비워두면 자동 생성합니다. Ubuntu/PAM 환경 차이로 인한 계정 생성 실패를 줄이기 위해 직접 입력 시 8자 이상을 Wizard 필수 조건으로 적용합니다.","label":"FTP 비밀번호","secret":true,"select":null},{"key":"FTP_GROUP","default":"logstash","section":"14. FTP 서버 (vsftpd)","help":"기본 logstash 그룹을 사용하면 업로드 파일을 Logstash 계열 프로세스와 공유하기 쉽습니다.","label":"Ftp Group","secret":false,"select":null},{"key":"FTP_USER_SHELL","default":"/usr/sbin/nologin","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp User Shell 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 /usr/sbin/nologin 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp User Shell","secret":false,"select":null},{"key":"FTP_ROOT_DIR","default":"/log","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP 사용자가 로그인했을 때 기준이 되는 루트 디렉터리입니다.\n왜 필요한가: chroot와 업로드 경로의 기준이 되고 FTP 계정이 접근 가능한 파일 범위를 결정합니다.\n입력 방법: 운영 폴더 구조에 맞춰 확인합니다. 일반 자동수집은 /log, ProxySG 로그 처리 스크립트는 /home 계열 구조를 사용할 수 있습니다.","label":"FTP 루트 경로","secret":false,"select":null},{"key":"FTP_UPLOAD_DIR","default":"/log/incoming","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP 클라이언트가 실제 로그 파일을 업로드할 기본 디렉터리입니다.\n왜 필요한가: 업로드된 파일이 후속 처리 스크립트/Logstash가 바라보는 위치에 도착해야 자동 수집이 이어집니다.\n입력 방법: 송신 장비의 FTP 경로와 파일 처리 Source 경로가 일치하도록 설정합니다.","label":"FTP 기본 업로드 경로","secret":false,"select":null},{"key":"FTP_ROOT_MODE","default":"0755","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Root Mode 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 0755 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Root Mode","secret":false,"select":null},{"key":"FTP_UPLOAD_MODE","default":"2770","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Upload Mode 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 2770 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Upload Mode","secret":false,"select":null},{"key":"FTP_LOCAL_UMASK","default":"0007","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Local Umask 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 0007 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Local Umask","secret":false,"select":null},{"key":"FTP_CHROOT_LOCAL_USER","default":"true","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP 사용자를 지정한 루트 디렉터리 밖으로 나가지 못하게 제한합니다.\n왜 필요한가: FTP 계정이 서버의 다른 파일시스템을 탐색하는 것을 줄이는 보안 통제입니다.\n입력 방법: 일반적으로 true 권장. /home/main과 /home/ssl 등 여러 절대경로 접근이 필요하면 경로 설계를 먼저 확인합니다.","label":"FTP Chroot","secret":false,"select":null},{"key":"FTP_ALLOW_WRITEABLE_CHROOT","default":"false","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Allow Writeable Chroot 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 false 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Allow Writeable Chroot","secret":false,"select":null},{"key":"FTP_ALLOW_ANONYMOUS","default":"false","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Allow Anonymous 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 false 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Allow Anonymous","secret":false,"select":null},{"key":"FTP_DOWNLOAD_ENABLE","default":"false","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Download Enable 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 false 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Download Enable","secret":false,"select":null},{"key":"FTP_BANNER","default":"ELK Log Upload FTP","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Banner 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 ELK Log Upload FTP 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Banner","secret":false,"select":null},{"key":"FTP_ACTIVE_ENABLE","default":"false","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP Active Mode 관련 설정을 활성화합니다.\n왜 필요한가: connect_from_port_20=YES 방식의 Active Mode와 호환하기 위한 설정입니다.\n입력 방법: 기존 장비가 Active FTP를 사용하면 켭니다. 방화벽/NAT 환경에서는 Passive Mode가 더 단순할 수 있습니다.","label":"Active FTP 허용","secret":false,"select":null},{"key":"FTP_CONNECT_FROM_PORT_20","default":"false","section":"14. FTP 서버 (vsftpd)","help":"기능: Active FTP 데이터 연결의 출발지 포트를 20번으로 사용합니다.\n왜 필요한가: 일부 레거시 FTP 클라이언트와 방화벽 정책이 표준 FTP-DATA 포트 20을 기대합니다.\n입력 방법: 표준 Active Mode(FTP-DATA 20번 포트) 호환이 필요할 때 사용합니다.","label":"FTP 데이터 Port 20 사용","secret":false,"select":null},{"key":"FTP_PASV_ENABLE","default":"true","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP Passive Mode를 활성화합니다.\n왜 필요한가: 클라이언트가 데이터 연결을 서버 쪽 Passive Port로 시작하므로 NAT/방화벽 환경에서 일반적으로 관리하기 쉽습니다.\n입력 방법: Active Mode를 쓰는 기본 구성은 false. 실환경 네트워크 정책이 Passive를 요구하면 true로 변경하고 Passive Port 범위를 방화벽에 허용합니다.","label":"Passive FTP 사용","secret":false,"select":null},{"key":"FTP_PASV_MIN_PORT","default":"40000","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Pasv Min Port 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 40000 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Pasv Min Port","secret":false,"select":null},{"key":"FTP_PASV_MAX_PORT","default":"40100","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Pasv Max Port 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 40100 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Pasv Max Port","secret":false,"select":null},{"key":"FTP_PASV_ADDRESS","default":"","section":"14. FTP 서버 (vsftpd)","help":"NAT 외부 IP 또는 DNS를 광고해야 할 때만 지정. 비우면 연결된 서버 주소 사용.","label":"Ftp Pasv Address","secret":false,"select":null},{"key":"FTP_MAX_CLIENTS","default":"20","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Max Clients 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 20 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Max Clients","secret":false,"select":null},{"key":"FTP_MAX_PER_IP","default":"5","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Max Per Ip 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 5 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Max Per Ip","secret":false,"select":null},{"key":"FTP_IDLE_SESSION_TIMEOUT","default":"600","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Idle Session Timeout 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 600 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Idle Session Timeout","secret":false,"select":null},{"key":"FTP_DATA_CONNECTION_TIMEOUT","default":"120","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Data Connection Timeout 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 120 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Data Connection Timeout","secret":false,"select":null},{"key":"FTP_LOG_FILE","default":"/var/log/vsftpd.log","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Log File 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 /var/log/vsftpd.log 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Log File","secret":false,"select":null},{"key":"FTP_TLS_ENABLED","default":"false","section":"14. FTP 서버 (vsftpd)","help":"기능: FTP 제어/데이터 채널에 TLS(FTPS)를 적용합니다.\n왜 필요한가: 일반 FTP는 계정과 데이터가 암호화되지 않으므로 신뢰할 수 없는 구간에서는 보호가 필요합니다.\n입력 방법: 기본값은 사용 안 함(NO)입니다. 보안 요구가 있으면 FTPS 또는 SFTP 사용을 검토합니다.","label":"FTP TLS(FTPS)","secret":false,"select":null},{"key":"FTP_TLS_FORCE","default":"true","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Tls Force 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 true 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Tls Force","secret":false,"select":null},{"key":"FTP_TLS_CERT_FILE","default":"/etc/ssl/certs/elk-vsftpd.crt","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Tls Cert File 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 /etc/ssl/certs/elk-vsftpd.crt 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Tls Cert File","secret":false,"select":null},{"key":"FTP_TLS_KEY_FILE","default":"/etc/ssl/private/elk-vsftpd.key","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Tls Key File 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 /etc/ssl/private/elk-vsftpd.key 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Tls Key File","secret":false,"select":null},{"key":"FTP_TLS_CN","default":"","section":"14. FTP 서버 (vsftpd)","help":"비우면 현재 hostname 사용. 인증서가 없을 때만 self-signed 인증서를 자동 생성합니다.","label":"Ftp Tls Cn","secret":false,"select":null},{"key":"FTP_TLS_DAYS","default":"3650","section":"14. FTP 서버 (vsftpd)","help":"기능: Ftp Tls Days 값을 설정합니다.\n왜 필요한가: vsftpd의 계정, 경로, Active/Passive, TLS 및 권한을 제어합니다.\n입력 방법: 현재 기본값은 3650 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ftp Tls Days","secret":false,"select":null},{"key":"FTP_TLS_REQUIRE_REUSE","default":"false","section":"14. FTP 서버 (vsftpd)","help":"일부 FTP 클라이언트 호환성을 위해 기본 false. 보안정책에 따라 true로 변경 가능.","label":"Ftp Tls Require Reuse","secret":false,"select":null},{"key":"FTP_INTEGRATE_FILE_INGEST","default":"true","section":"14. FTP 서버 (vsftpd)","help":"true이면 FILE_INGEST_SOURCE_DIRS를 FTP_UPLOAD_DIR과 자동으로 맞춥니다.","label":"Ftp Integrate File Ingest","secret":false,"select":null},{"key":"PROXYSG_FLOW_ENABLED","default":"false","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: ProxySG 로그(MAIN·SSL, 선택 Cloud) 파일을 백업·처리 폴더로 복사·검증하는 로그 처리 스크립트를 서버에 설치하고 cron에 등록합니다.\n왜 필요한가: FTP로 도착한 원본을 백업 폴더에 보관하면서, Logstash는 처리 폴더의 파일만 읽도록 분리해 중복 수집과 유실을 막기 위해 사용합니다.\n입력 방법: ProxySG 로그를 이 방식으로 처리하려면 '사용'을 선택하세요. 일반 File Ingest 방식을 쓰려면 '사용 안 함'으로 두고 고급 설정의 파일 로그 자동 수집 관리자를 사용합니다.","label":"ProxySG 로그 처리 스크립트 사용","secret":false,"select":null},{"key":"PROXYSG_CLOUD_ENABLED","default":"false","section":"14A. ProxySG 로그 처리 스크립트","label":"Cloud 로그 처리 사용","secret":false,"select":null,"help":"기능: ProxySG Cloud 로그(.log.gz)도 같은 방식으로 처리할지 정합니다.\n왜 필요한가: Cloud 로그는 MAIN·SSL과 폴더와 필드 구성이 달라 별도 폴더·필터·인덱스가 필요합니다. 기본은 사용 안 함이며, 켜면 Cloud 수신/백업/처리 폴더, Logstash 입력(type cloud), 필터, 인덱스(proxy-cloud-날짜), Data View가 함께 만들어집니다.\n입력 방법: Cloud 로그를 수집할 때만 '사용'을 선택하세요. '사용 안 함'이면 Cloud 항목은 모두 적용되지 않습니다."},{"key":"PROXYSG_MAIN_SOURCE_DIR","default":"/home/main","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: MAIN 로그가 FTP 등을 통해 최초로 도착하는 Source 폴더입니다.\n왜 필요한가: 처리 스크립트가 이 폴더를 감시해 백업과 process 복사본을 만들기 때문에 실제 업로드 경로와 맞아야 합니다.\n입력 방법: ProxySG MAIN 로그의 실제 FTP 업로드 경로를 입력합니다. 기본 예시는 /home/main.","label":"MAIN FTP 수신 폴더","secret":false,"select":null},{"key":"PROXYSG_SSL_SOURCE_DIR","default":"/home/ssl","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: SSL 로그가 최초로 도착하는 Source 폴더입니다.\n왜 필요한가: MAIN과 분리해 SSL 로그를 별도 인덱스/필터로 처리하기 위한 시작 경로입니다.\n입력 방법: ProxySG SSL 로그의 실제 FTP 업로드 경로를 입력합니다. 기본 예시는 /home/ssl.","label":"SSL FTP 수신 폴더","secret":false,"select":null},{"key":"PROXYSG_CLOUD_SOURCE_DIR","default":"/home/cloud","section":"14A. ProxySG 로그 처리 스크립트","label":"Cloud FTP 수신 폴더","secret":false,"select":null,"help":"기능: Cloud 로그 파일이 FTP로 도착하는 수신 폴더입니다.\n왜 필요한가: 로그 처리 스크립트가 이 폴더의 *.log.gz를 백업·처리 폴더로 옮기기 때문입니다.\n입력 방법: 현재 기본값은 /home/cloud 입니다. 절대경로여야 하며 MAIN·SSL 폴더와 겹치지 않게 하세요."},{"key":"PROXYSG_MAIN_BACKUP_DIR","default":"/home/main_backup","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: MAIN 원본 로그를 보존할 백업 폴더입니다.\n왜 필요한가: Elasticsearch 수집 문제나 재처리가 필요할 때 원본을 복구할 수 있게 합니다.\n입력 방법: 백업 디스크 용량과 보존정책을 고려해 실제 마운트 경로를 지정합니다. 기본 예시는 /home/main_backup.","label":"MAIN 원본 백업 폴더","secret":false,"select":null},{"key":"PROXYSG_SSL_BACKUP_DIR","default":"/home/ssl_backup","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: SSL 원본 로그를 보존할 백업 폴더입니다.\n왜 필요한가: SSL 로그 재수집/감사/장애 복구 시 원본을 유지하기 위해 필요합니다.\n입력 방법: 백업 용량을 고려해 실제 경로를 지정합니다. 기본 예시는 /home/ssl_backup.","label":"SSL 원본 백업 폴더","secret":false,"select":null},{"key":"PROXYSG_CLOUD_BACKUP_DIR","default":"/home/cloud_backup","section":"14A. ProxySG 로그 처리 스크립트","label":"Cloud 원본 백업 폴더","secret":false,"select":null,"help":"기능: 처리한 Cloud 원본 파일을 보관하는 백업 폴더입니다.\n왜 필요한가: Logstash가 처리 폴더의 파일을 읽고 삭제해도 원본을 남겨 재처리와 확인에 쓰기 위해서입니다.\n입력 방법: 현재 기본값은 /home/cloud_backup 입니다. 절대경로여야 하며 MAIN·SSL 폴더와 겹치지 않게 하세요."},{"key":"PROXYSG_MAIN_PROCESS_DIR","default":"/home/main_process","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: Logstash가 읽을 MAIN 처리용 복사본을 두는 폴더입니다.\n왜 필요한가: FTP가 쓰는 Source와 Logstash가 삭제하는 파일을 분리해 파일 전송 중 삭제나 충돌을 방지합니다.\n입력 방법: Logstash 서비스 계정이 읽고 삭제할 수 있는 경로여야 합니다. 기본 예시는 /home/main_process.","label":"MAIN Logstash 처리 폴더","secret":false,"select":null},{"key":"PROXYSG_SSL_PROCESS_DIR","default":"/home/ssl_process","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: Logstash가 읽을 SSL 처리용 복사본을 두는 폴더입니다.\n왜 필요한가: SSL Source/Backup과 수집용 파일을 분리해 안정적으로 read mode를 사용할 수 있습니다.\n입력 방법: Logstash가 읽고 삭제할 수 있는 경로여야 합니다. 기본 예시는 /home/ssl_process.","label":"SSL Logstash 처리 폴더","secret":false,"select":null},{"key":"PROXYSG_CLOUD_PROCESS_DIR","default":"/home/cloud_process","section":"14A. ProxySG 로그 처리 스크립트","label":"Cloud Logstash 처리 폴더","secret":false,"select":null,"help":"기능: Logstash가 읽는 Cloud 처리 폴더입니다.\n왜 필요한가: Logstash는 이 폴더의 파일만 읽고 완료 후 삭제하므로 수신 폴더와 분리해야 합니다.\n입력 방법: 현재 기본값은 /home/cloud_process 입니다. 절대경로여야 하며 MAIN·SSL 폴더와 겹치지 않게 하세요."},{"key":"PROXYSG_FILE_GLOB","default":"*.log.gz","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: 로그 처리 스크립트와 Logstash가 처리할 파일 이름 패턴입니다.\n왜 필요한가: 수신 폴더에 다른 파일이 섞여 있어도 로그 파일(*.log.gz)만 복사하고 읽게 하기 위해서입니다.\n입력 방법: 현재 기본값은 *.log.gz 입니다. ProxySG가 올리는 파일 이름에 맞는 와일드카드 패턴을 입력하세요.","label":"처리할 파일 패턴","secret":false,"select":null},{"key":"PROXYSG_DIR_MODE","default":"0775","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: 로그 처리 스크립트가 만드는 폴더와 복사본에 부여하는 권한(chmod)입니다.\n왜 필요한가: FTP 계정과 logstash 계정이 같은 파일을 읽고 쓸 수 있어야 하기 때문입니다.\n입력 방법: 현재 기본값은 0775 입니다. 8진수(예: 0775)로 입력하세요.","label":"폴더·복사본 권한 (chmod)","secret":false,"select":null},{"key":"PROXYSG_PROCESS_SCRIPT","default":"/usr/local/sbin/elk-proxysg-log-process","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: 로그 처리 스크립트가 서버에 설치되는 경로입니다.\n왜 필요한가: cron이 이 경로의 스크립트를 실행하기 때문입니다.\n입력 방법: 현재 기본값은 /usr/local/sbin/elk-proxysg-log-process 입니다. 절대경로로 입력하세요.","label":"로그 처리 스크립트 설치 경로","secret":false,"select":null},{"key":"PROXYSG_PROCESS_LOG","default":"/var/log/elk-proxysg-log-process.log","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: 로그 처리 스크립트의 실행 기록(복사·검증·삭제 결과)을 남기는 파일입니다.\n왜 필요한가: 파일이 처리되지 않을 때 원인을 확인하기 위해서입니다.\n입력 방법: 현재 기본값은 /var/log/elk-proxysg-log-process.log 입니다. 절대경로로 입력하세요.","label":"로그 처리 스크립트 로그 파일","secret":false,"select":null},{"key":"PROXYSG_PROCESS_CRON","default":"0 3 * * *","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: 로그 처리 스크립트의 자동 실행 시간을 cron 형식(분 시 일 월 요일)으로 지정합니다.\n왜 필요한가: 수신 폴더에 도착한 파일을 정해진 시각마다 백업·처리 폴더로 옮기기 위해서입니다.\n입력 방법: 현재 기본값은 0 3 * * * 입니다. 테스트 중에는 * * * * *(매분)로 두고, 정상 확인 후 서버의 /etc/cron.d/elk-proxysg-log-process에서 실제 시간으로 바꾸세요.","label":"로그 처리 스크립트 실행 시간 (cron)","secret":false,"select":null},{"key":"PROXYSG_MAIN_SINCEDB","default":"/var/lib/logstash/sincedb-main","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: MAIN 로그 file input의 sincedb(읽은 위치 기록) 파일 경로입니다.\n왜 필요한가: Logstash가 재시작된 뒤에도 이미 읽은 파일을 다시 수집하지 않도록 기록하기 위해 필요합니다.\n입력 방법: 현재 기본값은 /var/lib/logstash/sincedb-main 입니다. 별도 요구사항이 없다면 유지하세요.","label":"MAIN sincedb 파일","secret":false,"select":null},{"key":"PROXYSG_SSL_SINCEDB","default":"/var/lib/logstash/sincedb-ssl","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: SSL 로그 file input의 sincedb(읽은 위치 기록) 파일 경로입니다.\n왜 필요한가: Logstash가 재시작된 뒤에도 이미 읽은 파일을 다시 수집하지 않도록 기록하기 위해 필요합니다.\n입력 방법: 현재 기본값은 /var/lib/logstash/sincedb-ssl 입니다. 별도 요구사항이 없다면 유지하세요.","label":"SSL sincedb 파일","secret":false,"select":null},{"key":"PROXYSG_CLOUD_SINCEDB","default":"/var/lib/logstash/sincedb-cloud","section":"14A. ProxySG 로그 처리 스크립트","label":"Cloud sincedb 파일","secret":false,"select":null,"help":"기능: Cloud 로그 file input의 sincedb(읽은 위치 기록) 파일 경로입니다.\n왜 필요한가: Logstash가 재시작된 뒤에도 이미 읽은 파일을 다시 수집하지 않도록 기록하기 위해 필요합니다.\n입력 방법: 현재 기본값은 /var/lib/logstash/sincedb-cloud 입니다. 별도 요구사항이 없다면 유지하세요."},{"key":"PROXYSG_LOGSTASH_DISCOVER_INTERVAL","default":"5","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: Logstash File Input이 새 파일을 다시 탐색하는 주기입니다.\n왜 필요한가: process 폴더에 새 .log.gz가 들어왔을 때 얼마나 빨리 수집을 시작하는지 결정합니다.\n입력 방법: 기본값 5초를 사용하며 파일 수가 매우 많으면 부하를 고려해 늘릴 수 있습니다.","label":"Logstash 새 파일 확인 주기(초)","secret":false,"select":null},{"key":"PROXYSG_LOGSTASH_MAX_OPEN_FILES","default":"1000","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: Logstash File Input이 동시에 열 수 있는 파일 수의 상한입니다.\n왜 필요한가: 대량 파일 유입 시 파일 디스크립터 고갈을 방지하면서 병렬 처리량을 조절합니다.\n입력 방법: 기본값 1000. 서버 ulimit보다 낮게 두고 실제 동시 파일 수에 맞춰 조정합니다.","label":"Logstash 동시 열기 파일 수","secret":false,"select":null},{"key":"PROXYSG_CSV_FILTER_ENABLED","default":"true","section":"14A. ProxySG 로그 처리 스크립트","help":"기능: ProxySG CSV 필드 파싱 필터를 활성화합니다.\n왜 필요한가: 원문 한 줄을 단순 message로 저장하지 않고 client ip, status 등 검색 가능한 필드로 분리하기 위해 필요합니다.\n입력 방법: '사용'이면 아래 MAIN·SSL(사용 시 Cloud) 로그 포맷대로 필드를 나눕니다. 이 방식을 쓰지 않으려면 '사용 안 함'으로 두세요. (빈 줄·주석만 버리고 한 줄 전체를 message로 저장합니다)","label":"ProxySG CSV 파싱","secret":false,"select":null},{"key":"PROXYSG_MAIN_LOG
