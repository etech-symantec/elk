alse","section":"19. UFW 방화벽 (선택)","help":"기능: 설치기가 Ubuntu UFW 방화벽 규칙을 생성/관리합니다.\n왜 필요한가: Kibana/Nginx/FTP/Logstash/Elasticsearch 포트를 허용할 대역을 자동으로 제한할 수 있습니다.\n입력 방법: 기존 회사 방화벽 정책이 따로 있으면 false 유지. 켜기 전 SSH 접근 허용 상태를 반드시 확인합니다.","label":"UFW 자동 관리","secret":false,"select":null},{"key":"UFW_ENABLE_IF_INACTIVE","default":"false","section":"19. UFW 방화벽 (선택)","help":"기능: Ufw Enable If Inactive 값을 설정합니다.\n왜 필요한가: 서비스 포트에 접근할 수 있는 네트워크 대역을 제한합니다.\n입력 방법: 현재 기본값은 false 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ufw Enable If Inactive","secret":false,"select":null},{"key":"UFW_KIBANA_ALLOWED_CIDRS","default":"192.168.0.0/16,10.0.0.0/8","section":"19. UFW 방화벽 (선택)","help":"콤마로 허용 CIDR. 비우면 해당 포트를 전체 허용하지 않음.","label":"Ufw Kibana Allowed Cidrs","secret":false,"select":null},{"key":"UFW_NGINX_ALLOWED_CIDRS","default":"192.168.0.0/16,10.0.0.0/8","section":"19. UFW 방화벽 (선택)","help":"기능: Nginx 80/443 포트에 접근할 수 있는 네트워크 대역입니다.\n왜 필요한가: Kibana 웹 UI가 불필요한 외부 네트워크에 노출되는 것을 제한합니다.\n입력 방법: UFW를 사용할 경우 실제 관리자/사용자 대역만 CIDR로 입력합니다.","label":"Kibana/Nginx 접속 허용 대역","secret":false,"select":null},{"key":"UFW_ELASTICSEARCH_ALLOWED_CIDRS","default":"127.0.0.1/32","section":"19. UFW 방화벽 (선택)","help":"기능: Ufw Elasticsearch Allowed Cidrs 값을 설정합니다.\n왜 필요한가: 서비스 포트에 접근할 수 있는 네트워크 대역을 제한합니다.\n입력 방법: 현재 기본값은 127.0.0.1/32 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ufw Elasticsearch Allowed Cidrs","secret":false,"select":null},{"key":"UFW_LOGSTASH_ALLOWED_CIDRS","default":"192.168.0.0/16,10.0.0.0/8","section":"19. UFW 방화벽 (선택)","help":"기능: Ufw Logstash Allowed Cidrs 값을 설정합니다.\n왜 필요한가: 서비스 포트에 접근할 수 있는 네트워크 대역을 제한합니다.\n입력 방법: 현재 기본값은 192.168.0.0/16,10.0.0.0/8 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Ufw Logstash Allowed Cidrs","secret":false,"select":null},{"key":"UFW_FTP_ALLOWED_CIDRS","default":"192.168.0.0/16,10.0.0.0/8","section":"19. UFW 방화벽 (선택)","help":"기능: FTP 제어/데이터 포트에 접근 가능한 송신 네트워크 대역입니다.\n왜 필요한가: FTP 서비스가 모든 네트워크에 노출되는 것을 방지합니다.\n입력 방법: UFW 사용 시 로그 송신 장비가 위치한 대역만 입력합니다.","label":"FTP 접속 허용 대역","secret":false,"select":null},{"key":"ENABLE_SERVICES_ON_BOOT","default":"true","section":"20. 서비스 / 설치 후 검증","help":"기능: 서버 재부팅 후 ELK/관련 서비스를 자동 시작하도록 systemd enable 합니다.\n왜 필요한가: 재부팅 뒤 로그 수집이 수동 개입 없이 복구되도록 합니다.\n입력 방법: 운영 서버는 true 권장. 테스트 서버에서만 필요 시 끕니다.","label":"부팅 시 자동 시작","secret":false,"select":null},{"key":"START_SERVICES_AFTER_INSTALL","default":"true","section":"20. 서비스 / 설치 후 검증","help":"기능: 설치가 끝난 직후 관련 서비스를 자동 시작합니다.\n왜 필요한가: 설치 완료 직후 Health Check와 웹 접속을 확인할 수 있게 합니다.\n입력 방법: 일반적으로 true. 설정파일을 추가 검토한 뒤 수동 시작하려면 false를 사용합니다.","label":"설치 후 즉시 시작","secret":false,"select":null},{"key":"WAIT_TIMEOUT_SECONDS","default":"180","section":"20. 서비스 / 설치 후 검증","help":"기능: 설치 후 서비스가 정상 상태가 될 때까지 기다릴 최대 시간입니다.\n왜 필요한가: Elasticsearch/Kibana가 초기 인증서·인덱스를 준비하는 동안 너무 빨리 실패로 판정하지 않게 합니다.\n입력 방법: 일반 서버는 180초 권장. 저사양 VM이나 느린 디스크에서는 늘릴 수 있습니다.","label":"설치 후 서비스 대기 시간(초)","secret":false,"select":null},{"key":"CREATE_TEST_EVENT","default":"false","section":"20. 서비스 / 설치 후 검증","help":"기능: 설치 완료 시 테스트 이벤트를 Logstash로 보내 인덱싱 경로를 확인합니다.\n왜 필요한가: 포트는 열렸지만 실제 Pipeline/Elasticsearch 출력이 실패하는 문제를 빠르게 확인할 수 있습니다.\n입력 방법: 운영 데이터에 테스트 문서가 남는 것이 싫으면 false 유지. 최초 검증 시에만 true로 사용할 수 있습니다.","label":"설치 후 테스트 이벤트 생성","secret":false,"select":null},{"key":"TEST_EVENT_MESSAGE","default":"ELK auto installer test event","section":"20. 서비스 / 설치 후 검증","help":"기능: Test Event Message 값을 설정합니다.\n왜 필요한가: 서비스 자동 시작, 대기시간, 테스트 이벤트와 사후 스크립트를 제어합니다.\n입력 방법: 현재 기본값은 ELK auto installer test event 입니다. 별도 요구사항이 없다면 유지하고, 운영 정책이나 네트워크/스토리지 구조가 다를 때만 변경합니다.","label":"Test Event Message","secret":false,"select":null},{"key":"POST_INSTALL_SCRIPT","default":"","section":"20. 서비스 / 설치 후 검증","help":"기능: Post Install Script 값을 설정합니다.\n왜 필요한가: 서비스 자동 시작, 대기시간, 테스트 이벤트와 사후 스크립트를 제어합니다.\n입력 방법: 선택 기능에서 필요한 값입니다. 해당 기능을 사용하지 않으면 비워둘 수 있으며, 사용 시 실제 운영환경 값으로 입력합니다.","label":"Post Install Script","secret":false,"select":null}],"simple":[{"id":1,"title":"Elastic 9.x 저장소","desc":"Elasticsearch·Kibana·Logstash를 내려받을 Elastic 공식 APT 저장소를 정합니다.\n저장소 버전(9.x)은 받을 제품군을, 정확한 버전은 특정 버전으로 고정할지(비우면 최신 9.x)를 정하고, GPG Key는 내려받은 패키지가 Elastic이 배포한 것인지 검증하는 데 쓰입니다.","vars":["ELASTIC_MAJOR","ELASTIC_VERSION","APT_GPG_KEY_URL","APT_REPOSITORY_URL"],"note":"Elastic 공식 APT 저장소와 설치 버전을 정하는 기능"},{"id":2,"title":"Elasticsearch","desc":"로그를 저장하고 검색하는 핵심 엔진인 Elasticsearch를 설정합니다.\n클러스터·노드 이름은 식별용이고, Listen 주소와 HTTPS 포트는 Kibana·Logstash 등이 접속하는 주소입니다. elastic 관리자 ID·비밀번호는 관리 계정이며, Heap(Xms/Xmx)은 사용할 메모리 크기, Wildcard 파괴 작업 허용은 *나 _all로 인덱스를 한꺼번에 삭제하는 명령을 막을지 정합니다. 기본 보안과 TLS도 함께 구성됩니다.","vars":["ES_CLUSTER_NAME","ES_NODE_NAME","ES_NETWORK_HOST","ES_HTTP_PORT","ES_ACTION_DESTRUCTIVE_REQUIRES_NAME","ELASTIC_USERNAME","ELASTIC_PASSWORD","ES_HEAP_MODE","ES_HEAP_MIN","ES_HEAP_MAX"],"note":"로그 저장·검색 엔진의 주소, 관리자 계정, 메모리를 정하는 기능"},{"id":3,"title":"Kibana","desc":"로그를 웹 화면으로 조회하는 Kibana의 접속 방식을 정합니다.\nListen 주소·포트는 브라우저가 접속하는 주소이고, 로그인 사용은 ID/비밀번호를 요구할지(끄면 읽기 전용 익명 접속), 세션 유휴 만료는 자리를 비웠을 때 자동 로그아웃할 시간입니다. 초기 사용자는 elastic 대신 쓸 전용 로그인 계정과 권한(Role)을 설치할 때 함께 만듭니다. Elasticsearch 연결용 서비스 토큰은 설치기가 자동으로 만들어 저장합니다.","vars":["KIBANA_SERVER_HOST","KIBANA_SERVER_PORT","KIBANA_LOGIN_ENABLED","KIBANA_SESSION_IDLE_TIMEOUT","KIBANA_CREATE_INITIAL_USER","KIBANA_INITIAL_USER_NAME","KIBANA_INITIAL_USER_PASSWORD","KIBANA_INITIAL_USER_ROLES","KIBANA_EXTRA_CONFIG_FILE"],"note":"웹 화면(Kibana)의 접속 주소, 로그인, 초기 사용자를 정하는 기능","confinfo":"kibana"},{"id":4,"title":"Nginx HTTPS (선택)","desc":"Kibana 앞에 Nginx를 두어 https://서버IP 로 접속하게 하는 선택 기능입니다.\n켜면 80번(HTTP) 접속을 443번(HTTPS)으로 자동 이동시키고, 인증서(자체 서명 생성 또는 기존 파일)와 그 CN/SAN·유효기간을 정합니다. 이때 Kibana는 외부에 직접 노출되지 않고 Nginx를 통해서만 접속됩니다. 끄면 http://서버IP:5601 로 Kibana에 직접 접속합니다.","vars":["INSTALL_NGINX","NGINX_HTTP_PORT","NGINX_HTTPS_PORT","NGINX_REDIRECT_HTTP_TO_HTTPS","NGINX_TLS_MODE","NGINX_TLS_CN","NGINX_TLS_DAYS","NGINX_TLS_CERT_FILE","NGINX_TLS_KEY_FILE"],"note":"Kibana를 https://서버IP 로 접속하게 하는 Nginx 선택 기능"},{"id":5,"title":"Logstash","desc":"수집한 로그를 읽어 가공한 뒤 Elasticsearch로 보내는 Logstash 파이프라인을 정합니다.\n파이프라인 프로필은 입력·필터 구성의 기본형(일반 / ProxySG 로그 처리 전용), Heap은 Logstash가 쓸 메모리입니다. ProxySG CSV 파싱은 로그 한 줄을 필드별로 나누는 필터이고, 폴더 확인 주기와 최대 동시 열기 파일 수는 파일을 읽는 속도와 부하를 조절합니다.","vars":["LOGSTASH_PROFILE","LOGSTASH_HEAP_MIN","LOGSTASH_HEAP_MAX","PROXYSG_CSV_FILTER_ENABLED","PROXYSG_LOGSTASH_DISCOVER_INTERVAL","PROXYSG_LOGSTASH_MAX_OPEN_FILES","LOGSTASH_PIPELINE_FILE","LOGSTASH_EXTRA_CONFIG_FILE"],"note":"수집한 로그를 가공해 Elasticsearch로 보내는 파이프라인 기능","confinfo":"logstash"},{"id":6,"title":"FTP (vsftpd)","desc":"로그 파일을 서버로 올려 받는 FTP 서버(vsftpd)를 설치하고 업로드용 계정을 만듭니다.\nFTP 계정·비밀번호는 업로드 로그인이고, Active/Passive는 FTP 데이터 연결 방식(방화벽 환경에 맞게 선택), FTPS(TLS)는 전송 구간 암호화, Chroot는 계정이 지정한 폴더 밖으로 나가지 못하게 가두는 기능입니다.","vars":["INSTALL_FTP_SERVER","FTP_USER","FTP_PASSWORD","FTP_ACTIVE_ENABLE","FTP_CONNECT_FROM_PORT_20","FTP_PASV_ENABLE","FTP_TLS_ENABLED","FTP_CHROOT_LOCAL_USER"],"note":"로그 파일을 FTP로 받는 서버(vsftpd)의 설치와 계정을 정하는 기능"},{"id":7,"title":"로그 처리 스크립트","desc":"ProxySG가 FTP로 올리는 로그(.log.gz)를 안전하게 처리하는 로그 처리 스크립트를 설정합니다. MAIN·SSL은 항상, Cloud는 선택(기본 사용 안 함)입니다.\n예약된 시간에 스크립트가 FTP 수신 폴더의 파일을 백업 폴더(원본 보관)와 처리 폴더로 복사·검증하고 수신 폴더의 원본을 지우면, Logstash는 처리 폴더의 파일만 읽고 완료 후 삭제합니다. 이 단계에서 로그 종류별 수신·백업·처리 폴더와 로그 포맷, 실행 시간을 정합니다.","vars":["PROXYSG_FLOW_ENABLED","PROXYSG_CLOUD_ENABLED","PROXYSG_MAIN_SOURCE_DIR","PROXYSG_SSL_SOURCE_DIR","PROXYSG_CLOUD_SOURCE_DIR","PROXYSG_MAIN_BACKUP_DIR","PROXYSG_SSL_BACKUP_DIR","PROXYSG_CLOUD_BACKUP_DIR","PROXYSG_MAIN_PROCESS_DIR","PROXYSG_SSL_PROCESS_DIR","PROXYSG_CLOUD_PROCESS_DIR","PROXYSG_PROCESS_CRON","PROXYSG_MAIN_LOG_FORMAT","PROXYSG_SSL_LOG_FORMAT","PROXYSG_CLOUD_LOG_FORMAT"],"note":"ProxySG 로그를 복사·검증해 Logstash가 읽게 하는 스크립트 기능","files":["proxysg-log-process.sh","proxysg-log-filter.conf","custom-pipeline.conf"],"cols3":true,"logtypes":true},{"id":8,"title":"인덱스 · Data View · ILM","desc":"Elasticsearch에 로그가 저장되는 방식과 보관 정책을 정합니다.\n인덱스 Prefix는 일별 인덱스 이름(예: proxy-main-날짜), Data View는 Kibana에서 그 인덱스들을 조회하기 위한 이름, Index Template은 새 인덱스에 샤드·레플리카 같은 설정을 자동 적용하는 규칙입니다. ILM 정책은 보존기간이 지난 인덱스를 자동 삭제하며, 샤드 수와 Replica 수는 데이터 분산과 복제 개수를 정합니다.","vars":["PROXYSG_MAIN_INDEX_PREFIX","PROXYSG_SSL_INDEX_PREFIX","PROXYSG_MAIN_DATA_VIEW_NAME","PROXYSG_SSL_DATA_VIEW_NAME","PROXYSG_ILM_POLICY_NAME","PROXYSG_INDEX_TEMPLATE_NAME","INDEX_NUMBER_OF_SHARDS","INDEX_NUMBER_OF_REPLICAS","ILM_DELETE_MIN_AGE","ILM_APPLY_TO_EXISTING"],"note":"인덱스 이름, 보관 기간(ILM), Data View를 정하는 기능"},{"id":9,"title":"서비스 · 방화벽","desc":"설치가 끝난 뒤 서비스를 어떻게 기동할지와 방화벽 규칙을 정합니다.\n부팅 시 자동 시작은 서버를 재부팅해도 서비스가 자동으로 올라오게 하고, 설치 후 즉시 시작은 설치 직후 바로 기동합니다. UFW 자동 관리를 켜면 Kibana/Nginx·FTP에 접속을 허용할 대역(CIDR)에 대한 방화벽 규칙을 추가합니다.","vars":["ENABLE_SERVICES_ON_BOOT","START_SERVICES_AFTER_INSTALL","UFW_MANAGE","UFW_NGINX_ALLOWED_CIDRS","UFW_FTP_ALLOWED_CIDRS"],"note":"서비스 자동 시작과 방화벽(UFW) 허용 대역을 정하는 기능"},{"id":10,"title":"자동 전송 및 설치","desc":"완성된 설치 파일을 내 PC에서 Ubuntu 서버로 보내 설치까지 자동으로 진행하는 기능입니다.\n서버 주소·SSH 포트·계정·비밀번호는 접속 정보이고, sudo 비밀번호는 설치 시 관리자 권한을 얻는 데 쓰입니다. 전송 후 자동 설치는 파일을 보낸 직후 설치를 시작하고, 성공 후 원격 설치파일 삭제는 서버에 남는 설치 파일(비밀번호 포함)을 지웁니다. 서비스 대기 시간은 설치 후 서비스가 정상 응답할 때까지 기다리는 최대 시간입니다.","vars":["WAIT_TIMEOUT_SECONDS"],"kind":"deploy","sub":"서버 · SSH 배포 설정","note":"설치 파일을 Ubuntu 서버로 전송해 자동 설치하는 기능"},{"id":11,"title":"검증 및 완료","desc":"입력값에 설치를 막는 오류가 없는지 확인하고, 구성 요약을 본 뒤 설치 파일을 받는 마지막 단계입니다.\n상태 모니터링은 설치 후 주기적으로 서비스와 디스크를 점검하고, 테스트 이벤트는 설치 직후 샘플 로그를 한 건 보내 수집→저장 경로가 동작하는지 확인합니다. 아래 버튼으로 설치 파일·ZIP·자동 실행 파일을 받거나 실행 명령을 복사합니다.","vars":["HEALTH_MONITOR_ENABLED","CREATE_TEST_EVENT"],"kind":"final","sub":"검증 · 저장 · 실행","note":"입력값을 검증하고 설치 파일을 받는 기능"}],"advanced":[{"title":"1. 설치 제어","vars":["INSTALL_ELASTICSEARCH","INSTALL_KIBANA","INSTALL_LOGSTASH","ELASTIC_MAJOR","ELASTIC_VERSION","APT_REPOSITORY_URL","APT_GPG_KEY_URL","APT_PROXY","HTTP_PROXY","HTTPS_PROXY","NO_PROXY"],"desc":"설치할 구성요소와 패키지를 내려받는 경로를 정합니다.\nElasticsearch·Kibana·Logstash 설치 여부, Elastic 저장소 버전·정확한 버전·저장소 주소·GPG Key, 그리고 사내망에서 외부 저장소에 접근할 때 쓰는 APT/HTTP(S) 프록시와 프록시 예외(NO_PROXY)를 설정합니다.","note":"설치할 구성요소, Elastic 저장소, 프록시를 정하는 기능"},{"title":"2. OS 기본 설정","vars":["SET_HOSTNAME","SYSTEM_HOSTNAME","TIMEZONE","ENABLE_NTP","DISABLE_SWAP","VM_MAX_MAP_COUNT","SYSTEM_SWAPPINESS","INSTALL_LOG","STATE_DIR","SECRETS_FILE","BACKUP_DIR"],"desc":"설치 대상 서버의 운영체제 환경을 Elastic 권장값에 맞춥니다.\n호스트명·시간대·NTP(시간 동기화), Swap 끄기와 vm.max_map_count(메모리 매핑 한도) 같은 커널 설정, 설치 로그·상태 정보·비밀번호 기록 파일·백업 폴더의 위치를 정합니다.","note":"호스트명·시간대·커널 설정 등 서버 OS 환경을 맞추는 기능"},{"title":"3. Elasticsearch 기본","vars":["ES_CLUSTER_NAME","ES_NODE_NAME","ES_NETWORK_HOST","ES_HTTP_PORT","ES_TRANSPORT_PORT","ES_ACTION_DESTRUCTIVE_REQUIRES_NAME","ES_PATH_DATA","ES_PATH_LOGS","ES_DISCOVERY_MODE","ES_DISCOVERY_SEED_HOSTS","ES_CLUSTER_INITIAL_MASTER_NODES","ES_SECURITY_ENABLED","ES_ENROLLMENT_ENABLED","ES_HTTP_TLS_ENABLED","ES_TRANSPORT_TLS_ENABLED","ELASTIC_USERNAME","ELASTIC_PASSWORD","ES_HEAP_MODE","ES_HEAP_MIN","ES_HEAP_MAX","ES_BOOTSTRAP_MEMORY_LOCK","ES_LIMIT_NOFILE","ES_LIMIT_NPROC","ES_EXTRA_CONFIG_FILE"],"desc":"Elasticsearch 본체의 동작을 정합니다.\n클러스터·노드 이름, 접속 주소와 포트(HTTP·노드 간 Transport), 데이터·로그 저장 경로, 단일/다중 노드(디스커버리) 방식, 보안(인증)·TLS·Enrollment 사용 여부, 관리자 계정, JVM Heap과 메모리 잠금·파일/프로세스 한도, 추가 YAML 주입 파일을 설정합니다.","note":"Elasticsearch의 이름·주소·저장 경로·보안·메모리를 정하는 기능"},{"title":"4. Elasticsearch 디스크 보호 설정","vars":["ES_DISK_WATERMARK_LOW","ES_DISK_WATERMARK_HIGH","ES_DISK_WATERMARK_FLOOD_STAGE","ES_CLUSTER_INFO_UPDATE_INTERVAL"],"desc":"디스크가 부족할 때 Elasticsearch가 스스로 보호하는 기준입니다.\nLow는 새 샤드 배치를 멈추는 사용률, High는 샤드를 다른 곳으로 옮기기 시작하는 사용률, Flood Stage는 인덱스를 읽기 전용으로 바꾸는 사용률이며, 디스크 상태를 확인하는 주기도 정합니다. 비워 두면 Elastic 기본값(보통 85/90/95%)을 씁니다.","note":"디스크 부족 시 Elasticsearch의 자체 보호 기준을 정하는 기능"},{"title":"5. Kibana","vars":["KIBANA_SERVER_NAME","KIBANA_SERVER_HOST","KIBANA_SERVER_PORT","KIBANA_LOGIN_ENABLED","KIBANA_SESSION_IDLE_TIMEOUT","KIBANA_PUBLIC_BASE_URL","KIBANA_ES_HOST","KIBANA_ES_SSL_VERIFICATION_MODE","KIBANA_SERVICE_TOKEN_NAME","KIBANA_SECURITY_ENCRYPTION_KEY","KIBANA_REPORTING_ENCRYPTION_KEY","KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY","KIBANA_LOG_LEVEL","KIBANA_CREATE_DATA_VIEW","KIBANA_DATA_VIEW_NAME","KIBANA_DATA_VIEW_TIME_FIELD","KIBANA_DATA_VIEW_ALLOW_NO_INDEX","KIBANA_CREATE_INITIAL_USER","KIBANA_INITIAL_USER_NAME","KIBANA_INITIAL_USER_PASSWORD","KIBANA_INITIAL_USER_ROLES","KIBANA_EXTRA_CONFIG_FILE"],"desc":"Kibana 웹 화면의 동작을 정합니다.\n서버 이름·Listen 주소·포트·외부 접속 주소(Public Base URL), Elasticsearch 연결(주소·TLS 인증서 검증 방식·서비스 토큰 이름), 저장 데이터·보고서·로그인 세션을 보호하는 암호화 키, 로그인 사용 여부와 세션 만료, 설치 때 만들 Data View와 초기 사용자(ID·Role)를 설정합니다.","note":"Kibana의 주소·연결·로그인·초기 사용자를 정하는 기능"},{"title":"5A. Nginx HTTPS (선택)","vars":["INSTALL_NGINX","NGINX_SERVER_NAME","NGINX_HTTP_PORT","NGINX_HTTPS_PORT","NGINX_REDIRECT_HTTP_TO_HTTPS","NGINX_DISABLE_DEFAULT_SITE","NGINX_PROXY_HOST","NGINX_PROXY_PORT","NGINX_CLIENT_MAX_BODY_SIZE","NGINX_TLS_MODE","NGINX_TLS_CERT_FILE","NGINX_TLS_KEY_FILE","NGINX_TLS_CN","NGINX_TLS_DAYS","NGINX_TLS_PROTOCOLS","NGINX_TLS_CIPHERS"],"desc":"Kibana 앞에서 HTTPS(443)를 받아 전달하는 Nginx 리버스 프록시(선택)입니다.\n서버 이름·HTTP/HTTPS 포트, 80→443 자동 이동, 기본 사이트 제거, Kibana로 전달할 주소, 업로드 크기 제한, 인증서 방식(자체 서명 생성 또는 기존 파일)과 CN/SAN·유효기간·TLS 버전·암호화 스위트를 설정합니다.","note":"Kibana를 HTTPS로 전달하는 Nginx 리버스 프록시 선택 기능"},{"title":"6. Logstash 기본","vars":["LOGSTASH_NODE_NAME","LOGSTASH_PATH_DATA","LOGSTASH_PATH_LOGS","LOGSTASH_PIPELINE_ID","LOGSTASH_PIPELINE_FILE","LOGSTASH_PROFILE","LOGSTASH_HEAP_MIN","LOGSTASH_HEAP_MAX","LOGSTASH_PIPELINE_WORKERS","LOGSTASH_PIPELINE_BATCH_SIZE","LOGSTASH_PIPELINE_BATCH_DELAY","LOGSTASH_CONFIG_RELOAD_AUTOMATIC","LOGSTASH_CONFIG_RELOAD_INTERVAL","LOGSTASH_QUEUE_TYPE","LOGSTASH_QUEUE_MAX_BYTES","LOGSTASH_QUEUE_PAGE_CAPACITY","LOGSTASH_QUEUE_DRAIN","LOGSTASH_DEAD_LETTER_QUEUE","LOGSTASH_DLQ_MAX_BYTES","LOGSTASH_API_ENABLED","LOGSTASH_API_HOST","LOGSTASH_API_PORT","LOGSTASH_ES_USERNAME","LOGSTASH_ES_PASSWORD","LOGSTASH_ES_ROLE","LOGSTASH_ES_HOST","LOGSTASH_EXTRA_CONFIG_FILE"],"desc":"Logstash의 실행 환경과 성능을 정합니다.\n노드 이름·데이터/로그 경로, 파이프라인 ID·설정 파일 위치·프로필, Heap, 동시 처리 수(Workers)와 배치 크기, 설정 파일 변경 시 자동 재로드, 이벤트 유실을 줄이는 영구 큐(Persistent Queue)와 처리 실패 이벤트를 보관하는 Dead Letter Queue, 모니터링 API, Elasticsearch로 보낼 때 쓰는 전용 계정·권한을 설정합니다.","note":"Logstash의 경로·성능·큐·모니터링·전용 계정을 정하는 기능"},{"title":"7. Logstash Input - TCP","vars":["LS_TCP_ENABLED","LS_TCP_HOST","LS_TCP_PORT","LS_TCP_CODEC"],"desc":"TCP 포트로 들어오는 로그를 Logstash가 받도록 합니다.\n사용 여부, 수신 주소와 포트, 받은 데이터를 해석하는 방식(codec: plain 그대로 / json / json_lines)을 정합니다. 방화벽(UFW)을 관리한다면 이 포트에 접속을 허용할 대역도 함께 정해야 합니다.","note":"TCP 포트로 들어오는 로그를 받는 입력 기능"},{"title":"8. Logstash Input - UDP","vars":["LS_UDP_ENABLED","LS_UDP_HOST","LS_UDP_PORT","LS_UDP_CODEC"],"desc":"UDP 포트로 들어오는 로그를 Logstash가 받도록 합니다.\n사용 여부, 수신 주소와 포트, 받은 데이터를 해석하는 방식(codec: plain 그대로 / json / json_lines)을 정합니다. 방화벽(UFW)을 관리한다면 이 포트에 접속을 허용할 대역도 함께 정해야 합니다.","note":"UDP 포트로 들어오는 로그를 받는 입력 기능"},{"title":"9. Logstash Input - Syslog","vars":["LS_SYSLOG_ENABLED","LS_SYSLOG_HOST","LS_SYSLOG_PORT"],"desc":"네트워크 장비와 서버가 보내는 Syslog 메시지를 Logstash가 받도록 합니다.\n사용 여부와 수신 주소, 포트를 정합니다. 방화벽(UFW)을 관리한다면 이 포트에 접속을 허용할 대역도 함께 정해야 합니다.","note":"Syslog 메시지를 받는 입력 기능"},{"title":"10. Logstash Input - Beats","vars":["LS_BEATS_ENABLED","LS_BEATS_HOST","LS_BEATS_PORT"],"desc":"Filebeat 같은 Elastic Beats(Elastic Agent 포함)가 보내는 데이터를 Logstash가 받도록 합니다.\n사용 여부와 수신 주소, 포트를 정합니다. 방화벽(UFW)을 관리한다면 이 포트에 접속을 허용할 대역도 함께 정해야 합니다.","note":"Beats·Elastic Agent가 보내는 데이터를 받는 입력 기능"},{"title":"11. Logstash Input - HTTP","vars":["LS_HTTP_ENABLED","LS_HTTP_HOST","LS_HTTP_PORT","LS_HTTP_CODEC"],"desc":"HTTP 요청으로 전달되는 로그를 Logstash가 받도록 합니다. 애플리케이션이 JSON 로그를 직접 전송할 때 쓰는 입력입니다.\n사용 여부, 수신 주소와 포트, 받은 본문을 해석하는 방식(codec)을 정합니다.","note":"HTTP 요청으로 전달되는 로그를 받는 입력 기능"},{"title":"12. Logstash Input - File","vars":["LS_FILE_ENABLED","LS_FILE_PATHS","LS_FILE_EXCLUDE","LS_FILE_MODE","LS_FILE_START_POSITION","LS_FILE_SINCEDB_PATH","LS_FILE_CODEC","LS_FILE_IGNORE_OLDER","LS_FILE_CLOSE_OLDER","LS_FILE_COMPLETED_ACTION","LS_FILE_COMPLETED_LOG_PATH"],"desc":"서버에 있는 로그 파일을 Logstash가 직접 읽도록 하는 입력입니다.\n읽을 경로와 제외 패턴, 읽기 방식(tail=실시간 추적 / read=완성된 파일을 한 번 처리), 시작 위치, 어디까지 읽었는지 기록하는 sincedb, 오래된 파일을 무시하거나 닫는 기준, 처리 완료 후 동작(삭제/기록)과 완료 기록 파일을 정합니다.","note":"서버의 로그 파일을 직접 읽는 입력 기능"},{"title":"13. Logstash Filter","vars":["LS_PARSE_JSON_MESSAGE","LS_JSON_SOURCE_FIELD","LS_JSON_TARGET_FIELD","LS_DATE_SOURCE_FIELD","LS_DATE_MATCH","LS_DATE_TARGET_FIELD","LS_DATE_TIMEZONE","LS_DROP_EMPTY_MESSAGE","LS_CUSTOM_FILTER_FILE","LS_STDOUT_DEBUG"],"desc":"입력된 이벤트를 가공하는 공통 필터입니다.\nmessage가 JSON이면 필드로 펼치고, 로그 안의 시간 값을 시간 필드로 변환하며(시간대 지정), 빈 메시지는 버립니다. 필요하면 직접 만든 필터 파일을 추가하거나 디버그용 stdout 출력을 켭니다.","note":"JSON 파싱, 시간 변환, 빈 메시지 제거 등 이벤트 가공 필터 기능"},{"title":"14. FTP 서버 (vsftpd)","vars":["INSTALL_FTP_SERVER","FTP_PACKAGE","FTP_LISTEN_ADDRESS","FTP_LISTEN_PORT","FTP_USER","FTP_PASSWORD","FTP_GROUP","FTP_USER_SHELL","FTP_ROOT_DIR","FTP_UPLOAD_DIR","FTP_ROOT_MODE","FTP_UPLOAD_MODE","FTP_LOCAL_UMASK","FTP_CHROOT_LOCAL_USER","FTP_ALLOW_WRITEABLE_CHROOT","FTP_ALLOW_ANONYMOUS","FTP_DOWNLOAD_ENABLE","FTP_BANNER","FTP_ACTIVE_ENABLE","FTP_CONNECT_FROM_PORT_20","FTP_PASV_ENABLE","FTP_PASV_MIN_PORT","FTP_PASV_MAX_PORT","FTP_PASV_ADDRESS","FTP_MAX_CLIENTS","FTP_MAX_PER_IP","FTP_IDLE_SESSION_TIMEOUT","FTP_DATA_CONNECTION_TIMEOUT","FTP_LOG_FILE","FTP_TLS_ENABLED","FTP_TLS_FORCE","FTP_TLS_CERT_FILE","FTP_TLS_KEY_FILE","FTP_TLS_CN","FTP_TLS_DAYS","FTP_TLS_REQUIRE_REUSE","FTP_INTEGRATE_FILE_INGEST"],"desc":"로그 파일을 FTP로 받는 vsftpd 서버의 세부 설정입니다.\n수신 주소·포트, 업로드 계정·그룹과 루트·업로드 폴더 및 권한, Chroot(계정을 폴더 안에 가두기)와 익명 접속 허용 여부, Active/Passive 연결 방식과 Passive 포트 범위, 동시 접속 수·타임아웃, FTPS(TLS) 인증서, 그리고 파일 수집 관리자의 Source 경로를 업로드 경로와 맞추는 옵션을 정합니다.","note":"FTP로 로그를 받는 vsftpd 서버의 세부 동작을 정하는 기능"},{"title":"14A. ProxySG 로그 처리 스크립트","vars":["PROXYSG_FLOW_ENABLED","PROXYSG_CLOUD_ENABLED","PROXYSG_FILE_GLOB","PROXYSG_DIR_MODE","PROXYSG_PROCESS_SCRIPT","PROXYSG_PROCESS_LOG","PROXYSG_PROCESS_CRON","PROXYSG_LOGSTASH_DISCOVER_INTERVAL","PROXYSG_LOGSTASH_MAX_OPEN_FILES","PROXYSG_CSV_FILTER_ENABLED","PROXYSG_MAIN_SOURCE_DIR","PROXYSG_SSL_SOURCE_DIR","PROXYSG_CLOUD_SOURCE_DIR","PROXYSG_MAIN_BACKUP_DIR","PROXYSG_SSL_BACKUP_DIR","PROXYSG_CLOUD_BACKUP_DIR","PROXYSG_MAIN_PROCESS_DIR","PROXYSG_SSL_PROCESS_DIR","PROXYSG_CLOUD_PROCESS_DIR","PROXYSG_MAIN_LOG_FORMAT","PROXYSG_SSL_LOG_FORMAT","PROXYSG_CLOUD_LOG_FORMAT","PROXYSG_MAIN_SINCEDB","PROXYSG_SSL_SINCEDB","PROXYSG_CLOUD_SINCEDB","PROXYSG_MAIN_INDEX_PREFIX","PROXYSG_SSL_INDEX_PREFIX","PROXYSG_CLOUD_INDEX_PREFIX","PROXYSG_MAIN_DATA_VIEW_NAME","PROXYSG_SSL_DATA_VIEW_NAME","PROXYSG_CLOUD_DATA_VIEW_NAME","PROXYSG_ILM_POLICY_NAME","PROXYSG_INDEX_TEMPLATE_NAME"],"desc":"ProxySG가 FTP로 올리는 로그(.log.gz)를 처리하는 로그 처리 스크립트입니다. MAIN·SSL은 항상, Cloud는 선택(기본 사용 안 함)입니다.\n예약된 시간에 스크립트가 수신 폴더의 파일을 백업·처리 폴더로 복사·검증하고 원본을 지우면, Logstash는 처리 폴더만 읽고 완료 후 삭제합니다. 로그 종류별 폴더 경로, 처리 스크립트·로그·실행 시간, Logstash 읽기 설정(sincedb·확인 주기·동시 열기 수), CSV 파싱 필터와 로그 포맷, 인덱스·Data View·ILM·Template 이름을 함께 정합니다.","note":"ProxySG 로그를 복사·검증해 Logstash가 읽게 하는 스크립트 기능","files":["proxysg-log-process.sh","proxysg-log-filter.conf","custom-pipeline.conf"],"cols3":true,"logtypes":true},{"title":"15. 파일 로그 자동 수집 관리자","vars":["FILE_INGEST_MANAGER_ENABLED","FILE_INGEST_SOURCE_DIRS","FILE_INGEST_STAGING_DIR","FILE_INGEST_STATE_DIR","FILE_INGEST_BACKUP_DIR","FILE_INGEST_DUPLICATE_DIR","FILE_INGEST_QUARANTINE_DIR","FILE_INGEST_COMPLETED_LOG","FILE_INGEST_LOG","FILE_INGEST_LOCK_FILE","FILE_INGEST_EXTENSIONS","FILE_INGEST_RECURSIVE","FILE_INGEST_MIN_AGE_SECONDS","FILE_INGEST_MAX_FILES_PER_RUN"],"desc":"FTP/SFTP 등으로 떨어지는 일반 로그 파일을 자동으로 수집하는 관리 기능입니다.\n지정한 Source 폴더를 주기적으로 확인해 완성된 파일(최소 경과 시간이 지난 것)만 압축을 풀어 작업 폴더로 옮기고, Logstash가 읽어 처리한 뒤 원본은 백업 폴더에 보관합니다. 사용 여부와 폴더 경로(Source·작업·상태·백업·중복·격리), 대상 확장자, 하위 폴더 포함 여부, 1회 최대 처리 파일 수를 정합니다.","note":"FTP/SFTP로 떨어지는 로그 파일을 자동으로 수집·정리하는 기능"},{"title":"15A. 파일 수집 - 처리 옵션","vars":["FILE_INGEST_MAX_SOURCE_FILE_BYTES","FILE_INGEST_MIN_STAGING_FREE_GB","FILE_INGEST_DEDUPE_MODE","FILE_INGEST_DUPLICATE_ACTION","FILE_INGEST_PLAIN_BACKUP_COMPRESSION","FILE_INGEST_COMPRESSION_LEVEL","FILE_INGEST_PRESERVE_RELATIVE_PATH","FILE_INGEST_DELETE_STAGING_AFTER_COMPLETE"],"desc":"파일 수집 관리자가 파일을 처리하는 세부 방식입니다.\n원본 파일 최대 크기(0=제한 없음, 예: 214748364800 = 200 GiB)와 작업 폴더의 최소 여유 공간으로 디스크 고갈을 막고, 중복 판정 방식(내용 해시/메타데이터/안 함)과 중복 파일 처리(보관/삭제/그대로 둠), 백업 압축 방식·레벨, 하위 경로 유지 여부, 완료 후 작업 폴더 정리를 정합니다.","note":"파일 수집 시 크기 제한, 중복 처리, 백업 압축 방식을 정하는 기능"},{"title":"15B. 파일 수집 - 보관 · 스캔 옵션","vars":["FILE_INGEST_BACKUP_RETENTION_DAYS","FILE_INGEST_DUPLICATE_RETENTION_DAYS","FILE_INGEST_QUARANTINE_RETENTION_DAYS","FILE_INGEST_SCAN_INTERVAL","FILE_INGEST_TIMER_RANDOM_DELAY","FILE_INGEST_SOURCE_OWNER","FILE_INGEST_SOURCE_GROUP","FILE_INGEST_SOURCE_MODE"],"desc":"파일 수집 관리자의 보관 기간과 실행 주기입니다.\n백업·중복·격리 폴더의 파일을 며칠 뒤 지울지(0=자동 삭제 안 함), 새 파일을 확인하는 스캔 주기와 무작위 지연, 수집 폴더의 소유자·그룹·권한을 정합니다. 이 보관 기간은 Elasticsearch ILM 보존기간과는 별개입니다.","note":"파일 수집 보관 기간, 스캔 주기, 폴더 권한을 정하는 기능"},{"title":"16. 상태 모니터링","vars":["HEALTH_MONITOR_ENABLED","HEALTH_MONITOR_INTERVAL","HEALTH_MONITOR_RANDOM_DELAY","HEALTH_MONITOR_LOG","HEALTH_DISK_WARN_PERCENT","HEALTH_DISK_CRIT_PERCENT","HEALTH_AUTO_PAUSE_FILE_INGEST_ON_CRITICAL"],"desc":"설치 후 서비스와 디스크를 주기적으로 점검하는 상태 모니터입니다.\n사용 여부, 점검 주기와 무작위 지연, 결과 로그 위치, 디스크 사용률 경고·위험 기준을 정하고, 위험 수준이 되면 파일 신규 수집을 자동으로 멈출지 선택합니다. 자동 정지를 끄면 로그에 알림만 남깁니다.","note":"서비스와 디스크 상태를 주기적으로 점검하는 기능"},{"title":"17. 인덱스 / ILM","vars":["INDEX_PREFIX","INDEX_MODE","INDEX_DATE_PATTERN","INDEX_TEMPLATE_NAME","INDEX_TEMPLATE_PATTERNS","INDEX_TEMPLATE_PRIORITY","INDEX_NUMBER_OF_SHARDS","INDEX_NUMBER_OF_REPLICAS","INDEX_REFRESH_INTERVAL","INDEX_TOTAL_FIELDS_LIMIT","INDEX_MAPPING_FILE","ILM_POLICY_NAME","ILM_DELETE_ENABLED","ILM_DELETE_MIN_AGE","ILM_APPLY_TO_EXISTING","ILM_EXISTING_INDEX_PATTERNS","ILM_WARM_ENABLED","ILM_WARM_MIN_AGE","ILM_WARM_READONLY","ILM_WARM_FORCE_MERGE","ILM_WARM_FORCE_MERGE_SEGMENTS","ILM_ROLLOVER_ALIAS","ILM_ROLLOVER_PATTERN","ILM_ROLLOVER_MAX_AGE","ILM_ROLLOVER_MAX_PRIMARY_SHARD_SIZE","ILM_ROLLOVER_MAX_DOCS"],"desc":"로그가 저장될 인덱스의 이름·생성 방식과 보관 정책(ILM)을 정합니다.\n인덱스 Prefix·방식(일별 / rollover / 단일)·날짜 형식, Template(샤드·레플리카·refresh 주기·필드 수 제한·매핑 파일), 삭제 정책(보존기간)과 기존 인덱스 적용 여부, 선택적으로 Warm 단계(읽기 전용·병합)와 rollover 조건(기간·샤드 크기·문서 수)을 설정합니다.","note":"로그 인덱스의 이름·생성 방식과 보관 정책(ILM)을 정하는 기능"},{"title":"18. Snapshot / SLM (선택)","vars":["SNAPSHOT_REPO_ENABLED","SNAPSHOT_REPO_NAME","SNAPSHOT_REPO_PATH","SNAPSHOT_COMPRESS","SNAPSHOT_READONLY","SLM_POLICY_ENABLED","SLM_POLICY_NAME","SLM_SCHEDULE","SLM_SNAPSHOT_NAME","SLM_INDICES","SLM_IGNORE_UNAVAILABLE","SLM_INCLUDE_GLOBAL_STATE","SLM_RETENTION_EXPIRE_AFTER","SLM_RETENTION_MIN_COUNT","SLM_RETENTION_MAX_COUNT"],"desc":"Elasticsearch 데이터를 백업(Snapshot)하는 선택 기능입니다.\n스냅샷 저장소 이름과 저장 경로(파일 시스템), 압축·읽기 전용 여부, 그리고 SLM(자동 스냅샷 정책)의 실행 시각·대상 인덱스·스냅샷 보관 기간과 개수 범위를 정합니다.","note":"Elasticsearch 데이터를 백업(Snapshot)하는 선택 기능"},{"title":"19. UFW 방화벽 (선택)","vars":["UFW_MANAGE","UFW_ENABLE_IF_INACTIVE","UFW_KIBANA_ALLOWED_CIDRS","UFW_NGINX_ALLOWED_CIDRS","UFW_ELASTICSEARCH_ALLOWED_CIDRS","UFW_LOGSTASH_ALLOWED_CIDRS","UFW_FTP_ALLOWED_CIDRS"],"desc":"Ubuntu 방화벽(UFW)으로 서비스별 접속 허용 대역(CIDR)을 설정하는 선택 기능입니다.\nUFW 자동 관리 여부, 비활성 상태일 때 활성화할지, Kibana·Nginx(80/443)·Elasticsearch·Logstash 입력 포트·FTP별로 접속을 허용할 출발지 대역을 정합니다.","note":"서비스별 접속 허용 대역을 방화벽(UFW)에 등록하는 기능"},{"title":"20. 서비스 / 설치 후 검증","vars":["ENABLE_SERVICES_ON_BOOT","START_SERVICES_AFTER_INSTALL","WAIT_TIMEOUT_SECONDS","CREATE_TEST_EVENT","TEST_EVENT_MESSAGE","POST_INSTALL_SCRIPT"],"desc":"설치 마무리 동작을 정합니다.\n부팅 시 자동 시작과 설치 직후 시작 여부, 서비스가 정상 응답할 때까지 기다리는 최대 시간, 설치 후 테스트 이벤트 전송 여부와 메시지, 설치 완료 후 추가로 실행할 사용자 스크립트를 설정합니다.","note":"설치 후 시작·대기·테스트 이벤트 등 마무리 동작을 정하는 기능"},{"title":"21. 자동 전송 및 설치","desc":"완성된 설치 파일을 내 PC에서 Ubuntu 서버로 보내 설치를 시작하는 기능입니다.\n서버 주소·SSH 포트·계정·비밀번호는 접속 정보이고, sudo 비밀번호는 설치 시 관리자 권한을 얻는 데 쓰입니다(SSH와 같게 쓸 수 있음). 전송할 원격 폴더, 전송 후 자동 설치 여부, 성공 후 원격 설치파일(비밀번호 포함) 삭제 여부를 지정합니다.","vars":[],"kind":"deploy","sub":"서버 · SSH 배포 설정","note":"설치 파일을 Ubuntu 서버로 전송해 설치를 시작하는 기능"},{"title":"22. 검증 및 완료","desc":"입력값에 설치를 막는 오류가 없는지 확인하고, 구성 요약을 본 뒤 설치 파일을 받는 마지막 단계입니다.\n아래 버튼으로 설치 파일·ZIP·자동 실행 파일을 받거나 실행 명령을 복사합니다. 상태 모니터링과 테스트 이벤트 같은 설치 후 동작은 고급 설정 16단계와 24단계에서 정합니다.","vars":[],"kind":"final","sub":"검증 · 저장 · 실행","note":"입력값을 검증하고 설치 파일을 받는 기능"}],"template":"# ============================================================================\n# ELK Auto Installer v2.7 - Environment Configuration\n# Ubuntu 22.04 / 24.04, Elastic Stack 9.x\n# ============================================================================\n# 사용법:\n#   cp elk.env.example elk.env\n#   nano elk.env\n#   sudo bash install-elk.sh ./elk.env\n#\n# 주의:\n# - 이 파일에는 비밀번호가 들어갈 수 있으므로 chmod 600 권장\n# - 값에 공백/특수문자가 있으면 반드시 큰따옴표 사용\n# - 비밀번호를 비워두면 설치기가 안전한 임의값을 생성하여 SECRETS_FILE에 저장\n# ============================================================================\n\n# ----------------------------------------------------------------------------\n# 1. 설치 제어\n# ----------------------------------------------------------------------------\nINSTALL_ELASTICSEARCH=\"true\"\nINSTALL_KIBANA=\"true\"\nINSTALL_LOGSTASH=\"true\"\nELASTIC_MAJOR=\"9.x\"\n# 비워두면 저장소의 최신 9.x 설치. 예: \"9.5.4\"\nELASTIC_VERSION=\"\"\nAPT_REPOSITORY_URL=\"https://artifacts.elastic.co/packages\"\nAPT_GPG_KEY_URL=\"https://artifacts.elastic.co/GPG-KEY-elasticsearch\"\nAPT_PROXY=\"\"\nHTTP_PROXY=\"\"\nHTTPS_PROXY=\"\"\nNO_PROXY=\"127.0.0.1,localhost\"\n\n# ----------------------------------------------------------------------------\n# 2. OS 기본 설정\n# ----------------------------------------------------------------------------\nSET_HOSTNAME=\"false\"\nSYSTEM_HOSTNAME=\"elk01\"\nTIMEZONE=\"Asia/Seoul\"\nENABLE_NTP=\"true\"\nDISABLE_SWAP=\"true\"\nVM_MAX_MAP_COUNT=\"1048576\"\nSYSTEM_SWAPPINESS=\"1\"\n\n# 설치 로그 / 비밀정보 저장 위치\nINSTALL_LOG=\"/var/log/elk-auto-install.log\"\nSTATE_DIR=\"/root/.elk-auto-installer\"\nSECRETS_FILE=\"/root/.elk-auto-installer/secrets.env\"\nBACKUP_DIR=\"/root/.elk-auto-installer/backups\"\n\n# ----------------------------------------------------------------------------\n# 3. Elasticsearch 기본\n# ----------------------------------------------------------------------------\nES_CLUSTER_NAME=\"elk-cluster\"\nES_NODE_NAME=\"elk01\"\nES_NETWORK_HOST=\"0.0.0.0\"\nES_HTTP_PORT=\"9200\"\nES_TRANSPORT_PORT=\"9300\"\n# false이면 wildcard/_all 기반 파괴적 작업이 허용될 수 있습니다.\n# 기본은 안전을 위해 true이지만, Wizard 빠른 설정의 초기값은 false입니다.\nES_ACTION_DESTRUCTIVE_REQUIRES_NAME=\"true\"\nES_PATH_DATA=\"/var/lib/elasticsearch\"\nES_PATH_LOGS=\"/var/log/elasticsearch\"\n\n# 현재 설치기는 single-node 자동구성을 완전 지원.\n# multi-node는 discovery 변수까지 출력하지만 노드 간 Transport TLS 인증서 배포는 별도 설계 필요.\nES_DISCOVERY_MODE=\"single-node\"\nES_DISCOVERY_SEED_HOSTS=\"\"\nES_CLUSTER_INITIAL_MASTER_NODES=\"\"\n\n# 자동 보안/TLS 사용. 9.x 기본 보안 구성을 그대로 활용.\nES_SECURITY_ENABLED=\"true\"\nES_ENROLLMENT_ENABLED=\"true\"\nES_HTTP_TLS_ENABLED=\"true\"\nES_TRANSPORT_TLS_ENABLED=\"true\"\n\n# elastic 관리자 비밀번호. 비우면 자동 생성.\nELASTIC_USERNAME=\"elastic\"\nELASTIC_PASSWORD=\"\"\n\n# Elasticsearch JVM Heap\n# ES_HEAP_MODE=\"auto\" : Elastic JVM ergonomics 사용\n# ES_HEAP_MODE=\"fixed\": 아래 Xms/Xmx 적용\nES_HEAP_MODE=\"auto\"\nES_HEAP_MIN=\"16g\"\nES_HEAP_MAX=\"16g\"\n\n# 메모리 잠금. DISABLE_SWAP=true인 경우 보통 false로도 충분.\nES_BOOTSTRAP_MEMORY_LOCK=\"false\"\nES_LIMIT_NOFILE=\"65535\"\nES_LIMIT_NPROC=\"4096\"\n\n# Elasticsearch 추가 YAML을 파일로 주입하고 싶을 때\n# 예: /root/elk-extra/elasticsearch-extra.yml\nES_EXTRA_CONFIG_FILE=\"\"\n\n# ----------------------------------------------------------------------------\n# 4. Elasticsearch 디스크 보호 설정\n# ----------------------------------------------------------------------------\n# 비워두면 Elastic 기본값 사용(기본 low/high/flood는 일반적으로 85/90/95%).\nES_DISK_WATERMARK_LOW=\"85%\"\nES_DISK_WATERMARK_HIGH=\"90%\"\nES_DISK_WATERMARK_FLOOD_STAGE=\"95%\"\nES_CLUSTER_INFO_UPDATE_INTERVAL=\"30s\"\n\n# ----------------------------------------------------------------------------\n# 5. Kibana\n# ----------------------------------------------------------------------------\nKIBANA_SERVER_NAME=\"elk-kibana\"\nKIBANA_SERVER_HOST=\"0.0.0.0\"\nKIBANA_SERVER_PORT=\"5601\"\nKIBANA_LOGIN_ENABLED=\"true\"\nKIBANA_SESSION_IDLE_TIMEOUT=\"\"\n# 외부 URL이 정해져 있으면 예: https://elk.example.com:5601, 아니면 비움\nKIBANA_PUBLIC_BASE_URL=\"\"\n# 비우면 로컬 Elasticsearch의 최종 HTTP/HTTPS URL을 자동 사용\nKIBANA_ES_HOST=\"\"\nKIBANA_ES_SSL_VERIFICATION_MODE=\"full\"\nKIBANA_SERVICE_TOKEN_NAME=\"elk-auto-kibana\"\n\n# 비워두면 자동 생성 후 Kibana keystore에 저장\nKIBANA_SECURITY_ENCRYPTION_KEY=\"\"\nKIBANA_REPORTING_ENCRYPTION_KEY=\"\"\nKIBANA_SAVED_OBJECTS_ENCRYPTION_KEY=\"\"\n\n# Kibana 로그\nKIBANA_LOG_LEVEL=\"info\"\n\n# Data View 자동 생성\nKIBANA_CREATE_DATA_VIEW=\"true\"\nKIBANA_DATA_VIEW_NAME=\"ELK Logs\"\nKIBANA_DATA_VIEW_TIME_FIELD=\"@timestamp\"\nKIBANA_DATA_VIEW_ALLOW_NO_INDEX=\"true\"\n\n# 초기 접속용 일반 사용자 자동 생성(선택)\n# Stack Management > Security > Users에서 수동으로 만드는 사용자 생성 단계를 자동화할 수 있습니다.\nKIBANA_CREATE_INITIAL_USER=\"false\"\nKIBANA_INITIAL_USER_NAME=\"\"\nKIBANA_INITIAL_USER_PASSWORD=\"\"\n# 예: superuser / kibana_admin / viewer / monitoring_user,kibana_admin\nKIBANA_INITIAL_USER_ROLES=\"viewer\"\n\n# 추가 Kibana YAML\nKIBANA_EXTRA_CONFIG_FILE=\"\"\n\n# ----------------------------------------------------------------------------\n# 5A. Nginx HTTPS (선택)\n# ----------------------------------------------------------------------------\n# false이면 http://서버IP:5601 직접 접속. true이면 Nginx를 통해 https://서버IP 접속.\nINSTALL_NGINX=\"false\"\nNGINX_SERVER_NAME=\"_\"\nNGINX_HTTP_PORT=\"80\"\nNGINX_HTTPS_PORT=\"443\"\nNGINX_REDIRECT_HTTP_TO_HTTPS=\"true\"\nNGINX_DISABLE_DEFAULT_SITE=\"true\"\nNGINX_PROXY_HOST=\"127.0.0.1\"\n# 비우면 KIBANA_SERVER_PORT 사용\nNGINX_PROXY_PORT=\"\"\nNGINX_CLIENT_MAX_BODY_SIZE=\"100m\"\n\n# selfsigned / existing\nNGINX_TLS_MODE=\"selfsigned\"\nNGINX_TLS_CERT_FILE=\"/etc/ssl/certs/kibana-selfsigned.crt\"\nNGINX_TLS_KEY_FILE=\"/etc/ssl/private/kibana-selfsigned.key\"\n# 비우면 서버의 첫 번째 IP 또는 hostname을 사용. SAN에도 같은 값을 넣습니다.\nNGINX_TLS_CN=\"\"\nNGINX_TLS_DAYS=\"3650\"\nNGINX_TLS_PROTOCOLS=\"TLSv1.2 TLSv1.3\"\nNGINX_TLS_CIPHERS=\"HIGH:!aNULL:!MD5\"\n\n# ----------------------------------------------------------------------------\n# 6. Logstash 기본\n# ----------------------------------------------------------------------------\nLOGSTASH_NODE_NAME=\"elk-logstash\"\nLOGSTASH_PATH_DATA=\"/var/lib/logstash\"\nLOGSTASH_PATH_LOGS=\"/var/log/logstash\"\nLOGSTASH_PIPELINE_ID=\"main\"\nLOGSTASH_PIPELINE_FILE=\"/etc/logstash/conf.d/10-main.conf\"\n# generic / proxysg\n# proxysg는 ProxySG MAIN/SSL *.log.gz read-mode 구성을 사용합니다.\nLOGSTASH_PROFILE=\"generic\"\n\n# Logstash JVM Heap\nLOGSTASH_HEAP_MIN=\"2g\"\nLOGSTASH_HEAP_MAX=\"2g\"\n\n# Pipeline 튜닝. 0이면 Logstash 기본값(일반적으로 CPU core 수)을 사용하도록 생략.\nLOGSTASH_PIPELINE_WORKERS=\"0\"\nLOGSTASH_PIPELINE_BATCH_SIZE=\"125\"\nLOGSTASH_PIPELINE_BATCH_DELAY=\"50\"\nLOGSTASH_CONFIG_RELOAD_AUTOMATIC=\"true\"\nLOGSTASH_CONFIG_RELOAD_INTERVAL=\"3s\"\n\n# Persistent Queue\nLOGSTASH_QUEUE_TYPE=\"persisted\"\nLOGSTASH_QUEUE_MAX_BYTES=\"4gb\"\nLOGSTASH_QUEUE_PAGE_CAPACITY=\"64mb\"\nLOGSTASH_QUEUE_DRAIN=\"false\"\nLOGSTASH_DEAD_LETTER_QUEUE=\"true\"\nLOGSTASH_DLQ_MAX_BYTES=\"1gb\"\n\n# Logstash Monitoring API\nLOGSTASH_API_ENABLED=\"true\"\nLOGSTASH_API_HOST=\"127.0.0.1\"\nLOGSTASH_API_PORT=\"9600\"\n\n# Elasticsearch 쓰기 전용 계정. 비밀번호 비움 = 자동 생성\nLOGSTASH_ES_USERNAME=\"logstash_internal\"\nLOGSTASH_ES_PASSWORD=\"\"\nLOGSTASH_ES_ROLE=\"logstash_writer\"\n# 비우면 로컬 Elasticsearch의 최종 HTTP/HTTPS URL을 자동 사용\nLOGSTASH_ES_HOST=\"\"\n\n# 추가 logstash.yml\nLOGSTASH_EXTRA_CONFIG_FILE=\"\"\n\n# ----------------------------------------------------------------------------\n# 7. Logstash Input - TCP\n# ----------------------------------------------------------------------------\nLS_TCP_ENABLED=\"true\"\nLS_TCP_HOST=\"0.0.0.0\"\nLS_TCP_PORT=\"5514\"\n# plain / json / json_lines\nLS_TCP_CODEC=\"plain\"\n\n# ----------------------------------------------------------------------------\n# 8. Logstash Input - UDP\n# ----------------------------------------------------------------------------\nLS_UDP_ENABLED=\"false\"\nLS_UDP_HOST=\"0.0.0.0\"\nLS_UDP_PORT=\"5514\"\nLS_UDP_CODEC=\"plain\"\n\n# ----------------------------------------------------------------------------\n# 9. Logstash Input - Syslog\n# ----------------------------------------------------------------------------\nLS_SYSLOG_ENABLED=\"false\"\nLS_SYSLOG_HOST=\"0.0.0.0\"\nLS_SYSLOG_PORT=\"5515\"\n\n# ----------------------------------------------------------------------------\n# 10. Logstash Input - Beats / Elastic Agent\n# ----------------------------------------------------------------------------\nLS_BEATS_ENABLED=\"false\"\nLS_BEATS_HOST=\"0.0.0.0\"\nLS_BEATS_PORT=\"5044\"\n\n# ----------------------------------------------------------------------------\n# 11. Logstash Input - HTTP\n# ----------------------------------------------------------------------------\nLS_HTTP_ENABLED=\"false\"\nLS_HTTP_HOST=\"0.0.0.0\"\nLS_HTTP_PORT=\"8080\"\nLS_HTTP_CODEC=\"json\"\n\n# ----------------------------------------------------------------------------\n# 12. Logstash Input - File\n# ----------------------------------------------------------------------------\nLS_FILE_ENABLED=\"false\"\n# 콤마(,)로 여러 패턴 지정 가능\nLS_FILE_PATHS=\"/data/logs/*.log\"\nLS_FILE_EXCLUDE=\"*.gz,*.zip,*.xz,*.zst\"\n# tail / read\nLS_FILE_MODE=\"tail\"\n# beginning / end\nLS_FILE_START_POSITION=\"beginning\"\nLS_FILE_SINCEDB_PATH=\"/var/lib/logstash/.sincedb-main\"\nLS_FILE_CODEC=\"plain\"\nLS_FILE_IGNORE_OLDER=\"\"\nLS_FILE_CLOSE_OLDER=\"5m\"\n# mode=read에서만 유용: delete / log / log_and_delete (환경/플러그인에 따라 지원 차이 가능)\nLS_FILE_COMPLETED_ACTION=\"log\"\nLS_FILE_COMPLETED_LOG_PATH=\"/var/log/logstash/completed-files.log\"\n\n# ----------------------------------------------------------------------------\n# 13. Logstash Filter\n# ----------------------------------------------------------------------------\n# message 필드가 JSON 문자열이면 파싱\nLS_PARSE_JSON_MESSAGE=\"false\"\nLS_JSON_SOURCE_FIELD=\"message\"\nLS_JSON_TARGET_FIELD=\"\"\n\n# 로그 안의 날짜를 @timestamp로 변환할 때 사용\n# 예: LS_DATE_SOURCE_FIELD=\"logtime\"\n#     LS_DATE_MATCH=\"YYYY-MM-dd HH:mm:ss\"\nLS_DATE_SOURCE_FIELD=\"\"\nLS_DATE_MATCH=\"\"\nLS_DATE_TARGET_FIELD=\"@timestamp\"\nLS_DATE_TIMEZONE=\"Asia/Seoul\"\n\n# 빈 message 제거\nLS_DROP_EMPTY_MESSAGE=\"false\"\n\n# 임의 filter 블록 내용을 별도 파일로 추가\n# 파일에는 filter { } 바깥의 플러그인 내용만 작성하는 것을 권장\nLS_CUSTOM_FILTER_FILE=\"\"\n\n# 디버깅용 stdout\nLS_STDOUT_DEBUG=\"false\"\n\n\n# ----------------------------------------------------------------------------\n# 14. FTP 서버 (vsftpd)\n# ----------------------------------------------------------------------------\n# 로그 파일 업로드용 FTP 서버입니다. FILE_INGEST_MANAGER_ENABLED=true와 함께 사용하면\n# FTP_UPLOAD_DIR로 업로드된 파일을 자동 수집 파이프라인으로 연결할 수 있습니다.\nINSTALL_FTP_SERVER=\"true\"\nFTP_PACKAGE=\"vsftpd\"\nFTP_LISTEN_ADDRESS=\"0.0.0.0\"\nFTP_LISTEN_PORT=\"21\"\n\n# FTP 전용 로컬 계정. 비밀번호를 비우면 설치기가 자동 생성하여 SECRETS_FILE에 저장합니다.\nFTP_USER=\"elkftp\"\nFTP_PASSWORD=\"\"\n# 기본 logstash 그룹을 사용하면 업로드 파일을 Logstash 계열 프로세스와 공유하기 쉽습니다.\nFTP_GROUP=\"logstash\"\nFTP_USER_SHELL=\"/usr/sbin/nologin\"\n\n# Chroot 루트는 FTP 사용자가 쓰지 못하게 하고, 실제 업로드 디렉터리만 쓰기 허용합니다.\nFTP_ROOT_DIR=\"/log\"\nFTP_UPLOAD_DIR=\"/log/incoming\"\nFTP_ROOT_MODE=\"0755\"\nFTP_UPLOAD_MODE=\"2770\"\nFTP_LOCAL_UMASK=\"0007\"\nFTP_CHROOT_LOCAL_USER=\"true\"\nFTP_ALLOW_WRITEABLE_CHROOT=\"false\"\nFTP_ALLOW_ANONYMOUS=\"false\"\nFTP_DOWNLOAD_ENABLE=\"false\"\nFTP_BANNER=\"ELK Log Upload FTP\"\n# connect_from_port_20=YES / Active FTP 호환 옵션\nFTP_ACTIVE_ENABLE=\"false\"\nFTP_CONNECT_FROM_PORT_20=\"false\"\n\n# Passive FTP. 방화벽/NAT 환경에서는 고정 범위를 사용하는 것을 권장합니다.\nFTP_PASV_ENABLE=\"true\"\nFTP_PASV_MIN_PORT=\"40000\"\nFTP_PASV_MAX_PORT=\"40100\"\n# NAT 외부 IP 또는 DNS를 광고해야 할 때만 지정. 비우면 연결된 서버 주소 사용.\nFTP_PASV_ADDRESS=\"\"\n\nFTP_MAX_CLIENTS=\"20\"\nFTP_MAX_PER_IP=\"5\"\nFTP_IDLE_SESSION_TIMEOUT=\"600\"\nFTP_DATA_CONNECTION_TIMEOUT=\"120\"\nFTP_LOG_FILE=\"/var/log/vsftpd.log\"\n\n# FTPS(Explicit TLS) 선택. 사설망의 기존 장비 호환을 위해 기본은 false.\n# 인터넷/비신뢰망에서 FTP를 사용할 경우 TLS 사용을 권장합니다.\nFTP_TLS_ENABLED=\"false\"\nFTP_TLS_FORCE=\"true\"\nFTP_TLS_CERT_FILE=\"/etc/ssl/certs/elk-vsftpd.crt\"\nFTP_TLS_KEY_FILE=\"/etc/ssl/private/elk-vsftpd.key\"\n# 비우면 현재 hostname 사용. 인증서가 없을 때만 self-signed 인증서를 자동 생성합니다.\nFTP_TLS_CN=\"\"\nFTP_TLS_DAYS=\"3650\"\n# 일부 FTP 클라이언트 호환성을 위해 기본 false. 보안정책에 따라 true로 변경 가능.\nFTP_TLS_REQUIRE_REUSE=\"false\"\n\n# true이면 FILE_INGEST_SOURCE_DIRS를 FTP_UPLOAD_DIR과 자동으로 맞춥니다.\nFTP_INTEGRATE_FILE_INGEST=\"true\"\n\n# ----------------------------------------------------------------------------\n# 14A. ProxySG MAIN/SSL 파일 흐름\n# ----------------------------------------------------------------------------\n# Wizard 빠른 설정의 초기값은 true입니다.\n# FTP 업로드 → /home/main 또는 /home/ssl → 백업+process 복사 → Logstash read → process 파일 삭제\nPROXYSG_FLOW_ENABLED=\"false\"\nPROXYSG_CLOUD_ENABLED=\"false\"\nPROXYSG_MAIN_SOURCE_DIR=\"/home/main\"\nPROXYSG_SSL_SOURCE_DIR=\"/home/ssl\"\nPROXYSG_CLOUD_SOURCE_DIR=\"\"\nPROXYSG_MAIN_BACKUP_DIR=\"/home/main_backup\"\nPROXYSG_SSL_BACKUP_DIR=\"/home/ssl_backup\"\nPROXYSG_CLOUD_BACKUP_DIR=\"\"\nPROXYSG_MAIN_PROCESS_DIR=\"/home/main_process\"\nPROXYSG_SSL_PROCESS_DIR=\"/home/ssl_process\"\nPROXYSG_CLOUD_PROCESS_DIR=\"\"\nPROXYSG_FILE_GLOB=\"*.log.gz\"\nPROXYSG_DIR_MODE=\"0775\"\nPROXYSG_PROCESS_SCRIPT=\"/usr/local/sbin/elk-proxysg-log-process\"\nPROXYSG_PROCESS_LOG=\"/var/log/elk-proxysg-log-process.log\"\n# cron 기본값: 매일 03:00\nPROXYSG_PROCESS_CRON=\"0 3 * * *\"\n\n# Logstash file input 값\nPROXYSG_MAIN_SINCEDB=\"/var/lib/logstash/sincedb-main\"\nPROXYSG_SSL_SINCEDB=\"/var/lib/logstash/sincedb-ssl\"\nPROXYSG_CLOUD_SINCEDB=\"\"\nPROXYSG_LOGSTASH_DISCOVER_INTERVAL=\"5\"\nPROXYSG_LOGSTASH_MAX_OPEN_FILES=\"1000\"\nPROXYSG_CSV_FILTER_ENABLED=\"true\"\nPROXYSG_MAIN_LOG_FORMAT=\"\"\nPROXYSG_SSL_LOG_FORMAT=\"\"\nPROXYSG_CLOUD_LOG_FORMAT=\"\"\n\n# 인덱스/Data View/ILM 기본 이름\nPROXYSG_MAIN_INDEX_PREFIX=\"proxy-main\"\nPROXYSG_SSL_INDEX_PREFIX=\"proxy-ssl\"\nPROXYSG_CLOUD_INDEX_PREFIX=\"\"\nPROXYSG_MAIN_DATA_VIEW_NAME=\"main\"\nPROXYSG_SSL_DATA_VIEW_NAME=\"ssl\"\nPROXYSG_CLOUD_DATA_VIEW_NAME=\"\"\nPROXYSG_ILM_POLICY_NAME=\"proxy-retention-policy\"\nPROXYSG_INDEX_TEMPLATE_NAME=\"proxy-index-template\"\n\n# ----------------------------------------------------------------------------\n# 15. 파일 로그 자동 수집 관리자\n# ----------------------------------------------------------------------------\n# FTP/SFTP 등으로 완성된 로그 파일이 떨어지는 디렉터리를 주기적으로 확인하여\n# 압축 해제 -> Logstash read mode -> 완료 확인 -> 원본 백업/압축 순서로 처리합니다.\n# true이면 아래 설정을 기준으로 LS_FILE_*가 자동으로 read mode에 맞게 덮어써집니다.\nFILE_INGEST_MANAGER_ENABLED=\"true\"\n\n# 콤마로 복수 경로 지정 가능. 예: /log/incoming,/data/incoming\nFILE_INGEST_SOURCE_DIRS=\"/log/incoming\"\nFILE_INGEST_STAGING_DIR=\"/var/lib/elk-file-ingest/staging\"\nFILE_INGEST_STATE_DIR=\"/var/lib/elk-file-ingest/state\"\nFILE_INGEST_BACKUP_DIR=\"/backup/logs\"\nFILE_INGEST_DUPLICATE_DIR=\"/backup/logs/duplicates\"\nFILE_INGEST_QUARANTINE_DIR=\"/backup/logs/quarantine\"\nFILE_INGEST_COMPLETED_LOG=\"/var/log/logstash/completed-files.log\"\nFILE_INGEST_LOG=\"/var/log/elk-file-ingest.log\"\nFILE_INGEST_LOCK_FILE=\"/run/lock/elk-file-ingest.lock\"\n\n# 지원 형식: 평문 + 단일 파일 압축(gzip/xz/zstd/bzip2). tar/zip 아카이브는 기본 미지원.\nFILE_INGEST_EXTENSIONS=\"log,txt,json,csv,gz,xz,zst,bz2\"\nFILE_INGEST_RECURSIVE=\"true\"\n# 업로드 중인 파일을 건드리지 않도록 최종 수정 후 최소 대기 시간\nFILE_INGEST_MIN_AGE_SECONDS=\"60\"\n# 한 번의 timer 실행에서 신규 처리할 최대 파일 수\nFILE_INGEST_MAX_FILES_PER_RUN=\"20\"\n# 0=제한 없음. 예: 214748364800 = 200 GiB\nFILE_INGEST_MAX_SOURCE_FILE_BYTES=\"0\"\n# 스테이징 파일 생성 전 확보할 최소 여유 공간(GB)\nFILE_INGEST_MIN_STAGING_FREE_GB=\"20\"\n\n# content_sha256 / metadata / none\n# content_sha256은 압축 해제된 실제 내용 기준이므로 .gz/.xz/.zst가 달라도 내용이 같으면 중복 판정\nFILE_INGEST_DEDUPE_MODE=\"content_sha256\"\n# 중복 발견 시 archive / delete / leave\nFILE_INGEST_DUPLICATE_ACTION=\"archive\"\n\n# 평문 원본은 Elasticsearch 수집 완료 후 백업 시 다시 압축\n# zstd / gzip / xz / none\nFILE_INGEST_PLAIN_BACKUP_COMPRESSION=\"zstd\"\nFILE_INGEST_COMPRESSION_LEVEL=\"3\"\nFILE_INGEST_PRESERVE_RELATIVE_PATH=\"true\"\nFILE_INGEST_DELETE_STAGING_AFTER_COMPLETE=\"true\"\n\n# 0=자동 삭제 안 함. Elasticsearch ILM과 원본 백업 보관기간은 별개입니다.\nFILE_INGEST_BACKUP_RETENTION_DAYS=\"0\"\nFILE_INGEST_DUPLICATE_RETENTION_DAYS=\"0\"\nFILE_INGEST_QUARANTINE_RETENTION_DAYS=\"0\"\n\n# systemd timer 간격. 예: 30s, 1min, 5min\nFILE_INGEST_SCAN_INTERVAL=\"1min\"\nFILE_INGEST_TIMER_RANDOM_DELAY=\"10s\"\n\n# 설치기가 source 디렉터리를 새로 만들 때 적용할 소유권/권한\n# FTP 계정이 별도라면 해당 계정/그룹에 맞게 변경\nFILE_INGEST_SOURCE_OWNER=\"root\"\nFILE_INGEST_SOURCE_GROUP=\"logstash\"\nFILE_INGEST_SOURCE_MODE=\"0775\"\n\n# ----------------------------------------------------------------------------\n# 16. 상태 모니터링\n# ----------------------------------------------------------------------------\nHEALTH_MONITOR_ENABLED=\"true\"\nHEALTH_MONITOR_INTERVAL=\"5min\"\nHEALTH_MONITOR_RANDOM_DELAY=\"20s\"\nHEALTH_MONITOR_LOG=\"/var/log/elk-health-monitor.log\"\nHEALTH_DISK_WARN_PERCENT=\"85\"\nHEALTH_DISK_CRIT_PERCENT=\"92\"\n# 디스크 Critical 시 파일 신규 수집 timer 자동 정지. 기본 false(알림 로그만 기록)\nHEALTH_AUTO_PAUSE_FILE_INGEST_ON_CRITICAL=\"false\"\n\n# ----------------------------------------------------------------------------\n# 17. 인덱스 / ILM\n# ----------------------------------------------------------------------------\nINDEX_PREFIX=\"network-log\"\n# daily / rollover / plain\n# daily    : network-log-YYYY.MM.dd + ILM 보관/삭제 정책 적용 (현재 권장)\n# rollover : alias 기반 ILM rollover\n# plain    : network-log 단일 인덱스, ILM 미사용\nINDEX_MODE=\"daily\"\nINDEX_DATE_PATTERN=\"YYYY.MM.dd\"\nINDEX_TEMPLATE_NAME=\"network-log-template\"\n# 비우면 INDEX_PREFIX/INDEX_MODE에서 자동 계산. 여러 패턴은 콤마로 구분.\nINDEX_TEMPLATE_PATTERNS=\"\"\nINDEX_TEMPLATE_PRIORITY=\"200\"\nINDEX_NUMBER_OF_SHARDS=\"1\"\nINDEX_NUMBER_OF_REPLICAS=\"0\"\nINDEX_REFRESH_INTERVAL=\"5s\"\nINDEX_TOTAL_FIELDS_LIMIT=\"2000\"\n# 별도 mappings JSON. 예: {\"properties\":{...}}\nINDEX_MAPPING_FILE=\"\"\n\nILM_POLICY_NAME=\"network-log-ilm\"\nILM_DELETE_ENABLED=\"true\"\nILM_DELETE_MIN_AGE=\"90d\"\n# 기존에 이미 생성된 daily 인덱스에도 lifecycle.name을 적용할지 여부\nILM_APPLY_TO_EXISTING=\"false\"\n# 비우면 INDEX_TEMPLATE_PATTERNS 사용\nILM_EXISTING_INDEX_PATTERNS=\"\"\n\n# Warm phase(선택)\nILM_WARM_ENABLED=\"false\"\nILM_WARM_MIN_AGE=\"7d\"\nILM_WARM_READONLY=\"true\"\nILM_WARM_FORCE_MERGE=\"false\"\nILM_WARM_FORCE_MERGE_SEGMENTS=\"1\"\n\n# INDEX_MODE=rollover에서 사용\nILM_ROLLOVER_ALIAS=\"network-log\"\nILM_ROLLOVER_PATTERN=\"000001\"\nILM_ROLLOVER_MAX_AGE=\"1d\"\nILM_ROLLOVER_MAX_PRIMARY_SHARD_SIZE=\"50gb\"\nILM_ROLLOVER_MAX_DOCS=\"\"\n\n# ----------------------------------------------------------------------------\n# 18. Snapshot / SLM (선택)\n# ----------------------------------------------------------------------------\nSNAPSHOT_REPO_ENABLED=\"false\"\nSNAPSHOT_REPO_NAME=\"local-backup\"\nSNAPSHOT_REPO_PATH=\"/backup/elasticsearch\"\nSNAPSHOT_COMPRESS=\"true\"\nSNAPSHOT_READONLY=\"false\"\n\nSLM_POLICY_ENABLED=\"false\"\nSLM_POLICY_NAME=\"daily-snapshot\"\n# Quartz cron 예: 매일 01:30\nSLM_SCHEDULE=\"0 30 1 * * ?\"\nSLM_SNAPSHOT_NAME=\"<elk-snap-{now/d}>\"\nSLM_INDICES=\"network-log-*\"\nSLM_IGNORE_UNAVAILABLE=\"true\"\nSLM_INCLUDE_GLOBAL_STATE=\"false\"\nSLM_RETENTION_EXPIRE_AFTER=\"30d\"\nSLM_RETENTION_MIN_COUNT=\"3\"\nSLM_RETENTION_MAX_COUNT=\"50\"\n\n# ----------------------------------------------------------------------------\n# 19. UFW 방화벽 (선택)\n# ----------------------------------------------------------------------------\nUFW_MANAGE=\"false\"\nUFW_ENABLE_IF_INACTIVE=\"false\"\n# 콤마로 허용 CIDR. 비우면 해당 포트를 전체 허용하지 않음.\nUFW_KIBANA_ALLOWED_CIDRS=\"192.168.0.0/16,10.0.0.0/8\"\nUFW_NGINX_ALLOWED_CIDRS=\"192.168.0.0/16,10.0.0.0/8\"\nUFW_ELASTICSEARCH_ALLOWED_CIDRS=\"127.0.0.1/32\"\nUFW_LOGSTASH_ALLOWED_CIDRS=\"192.168.0.0/16,10.0.0.0/8\"\nUFW_FTP_ALLOWED_CIDRS=\"192.168.0.0/16,10.0.0.0/8\"\n\n# ----------------------------------------------------------------------------\n# 20. 서비스 / 설치 후 검증\n# ----------------------------------------------------------------------------\nENABLE_SERVICES_ON_BOOT=\"true\"\nSTART_SERVICES_AFTER_INSTALL=\"true\"\nWAIT_TIMEOUT_SECONDS=\"180\"\nCREATE_TEST_EVENT=\"false\"\nTEST_EVENT_MESSAGE=\"ELK auto installer test event\"\n\n# 사용자 정의 사후 실행 스크립트(선택)\nPOST_INSTALL_SCRIPT=\"\"\n"};

  L.push("deploy_self(){");

// Logstash 설정 문법에 맞춘 간이 스캐너: 주석(#), 큰/작은따옴표 문자열, 정규식 리터럴(=~ /…/, !~ /…/) 안의 { } [ ] 는 세지 않는다.
function scanConf(text){
  const s=String(text),n=s.length,stack=[],counts={'{':0,'}':0,'[':0,']':0};let i=0,line=1,problem=null,clean='';
  while(i<n){
    const ch=s[i];
    if(ch==='\n'){line++;clean+=ch;i++;continue}
    if(ch==='#'){while(i<n&&s[i]!=='\n')i++;continue}
    if(ch==='"'||ch==="'"){const q=ch;clean+='""';i++;while(i<n&&s[i]!==q){if(s[i]==='\\'){i++}else if(s[i]==='\n'){line++}i++}i++;continue}
    if(ch==='/'&&/(?:=~|!~)\s*$/.test(s.slice(Math.max(0,i-12),i))){clean+='//';i++;while(i<n&&s[i]!=='/'&&s[i]!=='\n'){if(s[i]==='\\')i++;i++}if(s[i]==='/')i++;continue}
    if(ch==='{'||ch==='['){stack.push({ch,line});counts[ch]++}
    else if(ch==='}'||ch===']'){counts[ch]++;const top=stack[stack.length-1],want=ch==='}'?'{':'[';if(top&&top.ch===want)stack.pop();else if(!problem)problem={type:'extra',ch,line}}

function lintFile(name,text){
  const e=[],wn=[],t=normText(text);

  }

}

function zipStore(entries){

  const parts=[],central=[];let offset=0;

    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,e.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,(3<<8)|20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,(((0o100000|e.mode)<<16)>>>0),true);ch.setUint32(42,offset,true);

  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);

  return out
}

  'set "ELK_WORK=%TEMP%\\elk-auto-installer-%RANDOM%%RANDOM%"',

  'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$p=[IO.File]::ReadAllText($env:ELK_SELF) -split (\'#####\'+\'PS#####\'); iex $p[1]"',
  'if errorlevel 1 goto :fail_extract',
  'set "PKG=%ELK_WORK%\\'+pkg+'"',
  'if not exist "%PKG%\\run-remote-deploy.cmd" goto :fail_extract',
  'call "%PKG%\\run-remote-deploy.cmd" %*',
  'set "RC=%ERRORLEVEL%"',
  'cd /d "%TEMP%"',
  'if defined ELK_KEEP_TEMP goto :keep',
  'rd /s /q "%ELK_WORK%" 2>nul',
  'exit /b %RC%',
  '',
  ':keep',
  'echo [INFO] Extracted files were kept in "%PKG%"',
  'exit /b %RC%',
  '',
  ':fail_extract',
  'powershell.exe -NoProfile -Command "Write-Host \'[ERROR] Could not extract the embedded package. Check free disk space in the TEMP folder and your antivirus settings.\' -ForegroundColor Yellow"',
  'if not defined ELK_NO_PAUSE pause',
  'exit /b 1',
  ''];
  const ps=[
  M,
  "$ErrorActionPreference='Stop'",
  'try{',
  "  $b64=($p[2] -replace '\\s','')",
  '  $work=$env:ELK_WORK',
  '  New-Item -ItemType Directory -Force -Path $work | Out-Null',
  "  $zip=Join-Path $work 'package.zip'",
  '  [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))',
  '  Add-Type -AssemblyName System.IO.Compression.FileSystem',
  '  [IO.Compression.ZipFile]::ExtractToDirectory($zip,$work)',
  '  Remove-Item -LiteralPath $zip -Force',
  '  exit 0',
  '}catch{',
  "  Write-Host ('[ERROR] '+$_.Exception.Message) -ForegroundColor Yellow",
  '  exit 1',
  '}',
  M];
  const b64=u8ToB64(zipBytes),lines=b64.match(/.{1,3000}/g)||[];
  return head.join('\r\n')+ps.join('\r\n')+'\r\n'+lines.join('\r\n')+'\r\n'
}
async function downloadLauncherCmd(){
  const errs=validationErrors(),st=document.getElementById('zipState');
  if(errs.length){alert('설치 오류 방지를 위해 아래 항목을 먼저 수정하세요.\n\n'+errs.map(x=>'• '+x).join('\n'));return false}
  const setState=(cls,txt)=>{if(st){st.className='zipstate '+cls;st.textContent=txt}};
  setState('','자동 실행 파일 만드는 중…');
  try{
    const {entries,wizard}=await collectPackageEntries(),text=buildLauncherCmd(zipStore(entries)),name=`elk-auto-install-v${PKG_VER}.cmd`;
    const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    setState('ok',`✓ ${name} (${Math.round(text.length/1024)} KB) 다운로드를 시작했습니다. 더블클릭하면 임시 폴더에 자동으로 풀고 설치 창이 실행됩니다. (Windows 보안 경고가 나오면 "실행"을 선택하세요)`);
    return true
  }catch(e){setState('warn','⚠ 자동 실행 파일 생성에 실패했습니다: '+(e&&e.message||e));return false}
}
let cmdShown='';
async function copyText(t){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);return !!ok}catch(e){return false}
}
async function showCmd(btnId,label,cmd){
  const box=document.getElementById('cmdView'),txt=document.getElementById('cmdText'),hd=document.getElementById('cmdLabel'),st=document.getElementById('cmdState');
  if(!box)return;
  const cmdBtns=['copyDeploy','copyLocal','copyValidate','copyCheck'];
  if(cmdShown===btnId&&box.style.display==='block'){box.style.display='none';cmdShown='';cmdBtns.forEach(id=>document.getElementById(id)?.classList.remove('on'));return}
  cmdShown=btnId;hd.textContent=label;txt.textContent=cmd;box.style.display='block';
  cmdBtns.forEach(id=>document.getElementById(id)?.classList.toggle('on',id===btnId));
  st.className='cmdstate';st.textContent='복사 중…';
  const ok=await copyText(cmd);
  if(cmdShown!==btnId)return;
  st.className='cmdstate '+(ok?'ok':'warn');
  st.textContent=ok?'✓ 클립보드에 복사되었습니다':'⚠ 자동 복사에 실패했습니다 — 아래 명령어를 직접 선택해 복사하세요';
}
